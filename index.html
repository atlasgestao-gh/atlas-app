  const snaps = await listarSnapshots();
  const tamanho = (JSON.stringify(DB).length / 1024).toFixed(0);
  const registros = ['colaboradores','asos','emissoes','laudos','unidades','cargos','matriz']
    .map(k => `${(DB[k]||[]).length} ${k}`).join(' · ');
  const ultimoArq = FS.ultimoWrite ? new Date(FS.ultimoWrite).toLocaleString('pt-BR') : null;
  const horasSem = FS.ultimoWrite ? (Date.now() - new Date(FS.ultimoWrite)) / 3600000 : null;

  const camada = (ativa, titulo, desc, extra) => `
    <div class="flex gap-3 p-4 rounded-xl border ${ativa?'border-emerald-200 bg-emerald-50/50':'border-slate-200 bg-slate-50/50'}">
      <div class="w-8 h-8 rounded-lg shrink-0 flex items-center justify-center ${ativa?'bg-success text-white':'bg-slate-300 text-white'}">
        <i class="fa-solid ${ativa?'fa-check':'fa-xmark'}"></i></div>
      <div class="min-w-0">
        <p class="font-medium text-sm text-slate-800">${titulo}</p>
        <p class="text-xs text-slate-600 mt-0.5">${desc}</p>
        ${extra ? `<p class="text-[11px] text-slate-500 mt-1">${extra}</p>` : ''}
      </div></div>`;

  $('#view').innerHTML = `
  <div class="space-y-5 max-w-5xl">
    <div class="rounded-xl border-2 ${FS.permissao?'border-success bg-emerald-50':'border-danger bg-red-50'} p-5">
      <div class="flex flex-wrap items-center gap-4">
        <div class="w-14 h-14 rounded-xl ${FS.permissao?'bg-success':'bg-danger'} text-white flex items-center justify-center text-2xl shrink-0">
          <i class="fa-solid ${FS.permissao?'fa-shield-halved':'fa-triangle-exclamation'}"></i></div>
        <div class="flex-1 min-w-[240px]">
          <p class="font-bold text-lg ${FS.permissao?'text-emerald-900':'text-red-900'}">
            ${FS.permissao ? 'Seus dados estão protegidos' : 'Seus dados estão desprotegidos'}</p>
          <p class="text-sm ${FS.permissao?'text-emerald-800':'text-red-800'} mt-0.5">
            ${FS.permissao
              ? 'Cada alteração é gravada em arquivo na pasta autorizada, que o Google Drive sincroniza automaticamente.'
              : 'Tudo está apenas na memória deste navegador. Autorize uma pasta para que o sistema grave sozinho.'}</p>
        </div>
        ${FS.permissao
          ? `<div class="flex gap-2">
              <button onclick="gravarArquivo().then(r=>toast(r?'Gravado agora.':'Falhou — veja o erro abaixo.', r?'ok':'erro')).then(()=>viewBackup())"
                class="px-4 py-2 rounded-lg text-sm bg-success text-white hover:bg-emerald-600 whitespace-nowrap">
                <i class="fa-solid fa-floppy-disk mr-1"></i>Gravar agora</button>
              <button onclick="verificarIntegridade()" class="px-4 py-2 rounded-lg text-sm bg-white border border-slate-300 hover:bg-slate-50 whitespace-nowrap">
                <i class="fa-solid fa-clipboard-check mr-1"></i>Conferir</button></div>`
          : `<button onclick="${FS.pasta?'reativarPermissao()':'ativarPasta()'}"
              class="px-5 py-3 rounded-lg text-sm bg-danger text-white hover:bg-red-600 whitespace-nowrap font-medium">
              <i class="fa-solid fa-folder-open mr-1"></i>${FS.pasta?'Reativar backup':'Ativar backup automático'}</button>`}
      </div>
      ${FS.ultimoErro ? `<p class="mt-3 text-xs bg-white rounded-lg px-3 py-2 text-red-700 border border-red-200">
        <i class="fa-solid fa-bug mr-1"></i>Último erro: ${esc(FS.ultimoErro)}</p>` : ''}
      ${horasSem !== null && horasSem > 24 ? `<p class="mt-3 text-xs bg-white rounded-lg px-3 py-2 text-amber-700 border border-amber-200">
        <i class="fa-solid fa-clock mr-1"></i>A última gravação em arquivo foi há mais de 24 horas.</p>` : ''}
      ${DB.meta && DB.meta.divergencia ? `<p class="mt-3 text-xs bg-white rounded-lg px-3 py-2 text-amber-700 border border-amber-200">
        <i class="fa-solid fa-code-compare mr-1"></i>As cópias tinham datas diferentes ao abrir; foi usada a mais recente.
        <span class="text-slate-500">(${esc(DB.meta.divergencia)})</span></p>` : ''}
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      ${camada(FS.permissao, '1. Arquivo no Google Drive',
        FS.permissao ? `Pasta autorizada: <b>${esc(FS.pasta.name)}</b> → <code class="text-[11px]">${ARQ_DADOS}</code>`
                     : 'Nenhuma pasta autorizada ainda.',
        ultimoArq ? 'Última gravação: ' + ultimoArq : 'Grava 12 s após cada alteração e ao fechar a aba.')}
      ${camada(true, '2. IndexedDB (neste navegador)',
        'Cópia local completa, sem o limite de 5 MB do localStorage.', 'Base atual: ' + tamanho + ' KB')}
      ${camada(!(DB.meta && DB.meta.localStorageCheio), '3. localStorage (terceira cópia)',
        DB.meta && DB.meta.localStorageCheio ? 'Cheio — as camadas 1 e 2 seguem funcionando.' : 'Cópia redundante de segurança.')}
      ${camada(snaps.length > 0, '4. Desfazer',
        'Guarda os 10 estados anteriores a cada operação de risco.', snaps.length + ' ponto(s) de retorno')}
    </div>

    <div class="bg-white rounded-xl border border-slate-200 p-5">
      <h3 class="font-semibold text-sm text-slate-700 mb-1">Conteúdo atual da base</h3>
      <p class="text-xs text-slate-500 mb-3">${esc(registros)}</p>
      <p class="text-xs text-slate-500">Carregado ao abrir de: <b>${esc((DB.meta&&DB.meta.fonteInicial)||'—')}</b>
        · último salvamento ${DB.meta&&DB.meta.salvoEm ? new Date(DB.meta.salvoEm).toLocaleString('pt-BR') : '—'}</p>
      <div class="flex flex-wrap gap-2 mt-4">
        ${botao('Baixar cópia agora','fa-download','exportBackup()','bg-white border border-slate-300 text-slate-700 hover:bg-slate-50')}
        ${botao('Restaurar de um arquivo','fa-upload','document.getElementById(\'fileImport\').click()','bg-white border border-slate-300 text-slate-700 hover:bg-slate-50')}
        ${FS.permissao ? botao('Trocar pasta','fa-folder-tree','ativarPasta()','bg-white border border-slate-300 text-slate-700 hover:bg-slate-50') : ''}
        ${FS.permissao ? botao('Desligar automático','fa-power-off','desativarPasta()','bg-white border border-slate-300 text-slate-600 hover:bg-red-50 hover:text-danger') : ''}
      </div>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 p-5">
      <h3 class="font-semibold text-sm text-slate-700 mb-1"><i class="fa-solid fa-rotate text-accent mr-2"></i>Planilhas de origem</h3>
      <p class="text-xs text-slate-500 mb-3">Quando a planilha de controle ganha colaboradores ou pedidos novos, traga-os
        sem perder o que já foi lançado aqui.</p>
      <div class="grid sm:grid-cols-2 gap-3">
        <div class="border border-slate-200 rounded-lg p-3">
          <p class="text-sm font-medium text-slate-700">Sincronizar novidades <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700">seguro</span></p>
          <p class="text-[11px] text-slate-500 mt-0.5 mb-2">Inclui só o que está na planilha e falta aqui. Não altera nem apaga nada do que existe.</p>
          ${botao('Sincronizar','fa-arrow-down','sincronizarPlanilha()')}
        </div>
        <div class="border border-slate-200 rounded-lg p-3">
          <p class="text-sm font-medium text-slate-700">Recarregar tudo <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-800">substitui</span></p>
          <p class="text-[11px] text-slate-500 mt-0.5 mb-2">Troca colaboradores, ASOs, exames e laudos pelos da planilha. Preserva atestados, relatórios, visitas e preços.</p>
          ${botao('Recarregar','fa-rotate-left','resetToSeed()','bg-white border border-slate-300 text-slate-600 hover:bg-amber-50')}
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-200">
        <h3 class="font-semibold text-sm text-slate-700">Desfazer — pontos de retorno</h3>
        <p class="text-xs text-slate-500">Guardados automaticamente antes de restaurações e exclusões em massa.</p>
      </div>
      <div class="divide-y divide-slate-100">
        ${snaps.length ? snaps.slice().reverse().map((s,i) => {
          const idx = snaps.length - 1 - i;
          const d = JSON.parse(s.dados);
          return `<div class="px-5 py-3 flex flex-wrap items-center gap-3 text-sm hover:bg-slate-50">
            <div class="flex-1 min-w-[200px]">
              <p class="text-slate-700">${new Date(s.em).toLocaleString('pt-BR')}</p>
              <p class="text-xs text-slate-500">${esc(s.motivo)} · ${d.colaboradores.length} colaboradores, ${d.asos.length} ASOs</p>
            </div>
            <button onclick="restaurarSnapshot(${idx})" class="px-3 py-1.5 rounded-lg text-xs bg-slate-100 hover:bg-slate-200 whitespace-nowrap">
              <i class="fa-solid fa-rotate-left mr-1"></i>Voltar a este ponto</button>
          </div>`;
        }).join('') : '<p class="px-5 py-8 text-center text-sm text-slate-400">Nenhum ponto de retorno ainda.</p>'}
      </div>
    </div>

    <div class="bg-blue-50 border border-blue-200 rounded-xl p-5 text-sm text-blue-900">
      <p class="font-semibold mb-2"><i class="fa-solid fa-circle-info mr-1"></i>Como funciona na prática</p>
      <ul class="space-y-1.5 text-xs list-disc pl-5">
        <li>Ao abrir o sistema, o Chrome pode pedir confirmação para gravar na pasta — é um clique, e a faixa vermelha some.</li>
        <li>O arquivo <code>${ARQ_DADOS}</code> é a fonte da verdade. Trocando de máquina, basta abrir o HTML, autorizar a mesma pasta do Drive e escolher "carregar esses dados".</li>
        <li>A subpasta <code>${PASTA_HIST}</code> guarda uma cópia por dia (${MANTER_DIARIOS} dias, mais o dia 1º de cada mês para sempre).</li>
        <li>A gravação usa arquivo temporário e só substitui o original no fim — uma queda de energia no meio não corrompe a base.</li>
        <li>O backup contém CPF, RG e dados de saúde. Mantenha a pasta do Drive restrita a quem já tem acesso às planilhas.</li>
      </ul>
    </div>
  </div>`;
}

async function verificarIntegridade(){
  if(!FS.permissao){ toast('Ative o backup automático primeiro.', 'alerta'); return; }
  try{
    const f = await (await FS.pasta.getFileHandle(ARQ_DADOS)).getFile();
    const d = JSON.parse(await f.text());
    const cmp = ['colaboradores','asos','emissoes','laudos','unidades'].map(k => ({
      chave: k, tela: (DB[k]||[]).length, arquivo: (d[k]||[]).length
    }));
    const ok = cmp.every(c => c.tela === c.arquivo);
    let hist = 0;
    try{
      const h = await FS.pasta.getDirectoryHandle(PASTA_HIST);
      for await (const [n, x] of h.entries()) if(x.kind === 'file') hist++;
    }catch(e){}

    openInfo('Conferência do arquivo gravado', `
      <div class="space-y-4">
        <div class="rounded-lg p-4 ${ok?'bg-emerald-50 border border-emerald-200':'bg-amber-50 border border-amber-200'}">
          <p class="font-semibold ${ok?'text-emerald-800':'text-amber-800'}">
            <i class="fa-solid ${ok?'fa-circle-check':'fa-triangle-exclamation'} mr-1"></i>
            ${ok ? 'O arquivo confere com o que está na tela.' : 'O arquivo está diferente da tela.'}</p>
          ${ok ? '' : '<p class="text-xs text-amber-700 mt-1">Clique em "Gravar agora" para sincronizar.</p>'}
        </div>
        <table class="w-full text-sm">
          <thead class="text-xs text-slate-500 text-left"><tr>
            <th class="py-2">Registro</th><th class="py-2 text-right">Nesta tela</th><th class="py-2 text-right">No arquivo</th></tr></thead>
          <tbody class="divide-y divide-slate-100">
            ${cmp.map(c => `<tr><td class="py-2">${c.chave}</td>
              <td class="py-2 text-right">${c.tela}</td>
              <td class="py-2 text-right ${c.tela===c.arquivo?'text-emerald-600':'text-danger font-semibold'}">${c.arquivo}</td></tr>`).join('')}
          </tbody></table>
        <div class="text-xs text-slate-500 space-y-1">
          <p><b>Arquivo:</b> ${esc(FS.pasta.name)} / ${ARQ_DADOS} — ${(f.size/1024).toFixed(0)} KB</p>
          <p><b>Modificado em:</b> ${new Date(f.lastModified).toLocaleString('pt-BR')}</p>
          <p><b>Cópias diárias no histórico:</b> ${hist}</p>
        </div>
      </div>`, 'max-w-lg');
  }catch(e){ toast('Não foi possível ler o arquivo: ' + e.message, 'erro'); }
}

/* ═══════════════════════════ BOOT ═══════════════════════════ */
$('#hojeLabel').textContent = HOJE.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });

(async function iniciar(){
  /* modo nuvem: exige login antes de qualquer coisa */
  if(CLOUD_ON){
    const sess = await nuvemSessao();
    if(!sess){ mostrarLogin(); return; }
  }

  try{
    await bootStorage();
  }catch(e){
    console.error('Falha ao carregar', e);
    DB = seedFresh();
    alert('Não foi possível ler os dados salvos (' + e.message + ').\n\n' +
          (CLOUD_ON
            ? 'Verifique sua conexão e recarregue a página. Se persistir, saia e entre de novo.'
            : 'O sistema abriu com a base original das planilhas. NÃO faça alterações: ' +
              'vá em "Backup e segurança" e restaure a partir de um arquivo antes de continuar.'));
  }
  carimboSalvamento();
  go('dashboard');

  /* botão "Sair" flutuante no modo nuvem */
  if(CLOUD_ON && !document.getElementById('btnSair')){
    const b = document.createElement('button');
    b.id = 'btnSair';
    b.innerHTML = '<i class="fa-solid fa-right-from-bracket"></i> Sair';
    b.style.cssText = 'position:fixed;bottom:14px;left:14px;z-index:600;background:#3f3f43;color:#fff;border:0;border-radius:20px;padding:6px 14px;font-size:.78rem;cursor:pointer;opacity:.85;box-shadow:0 2px 8px rgba(0,0,0,.25);';
    b.onmouseenter = () => b.style.opacity = '1';
    b.onmouseleave = () => b.style.opacity = '.85';
    b.onclick = sairNuvem;
    document.body.appendChild(b);
  }

  /* se ainda não há pasta autorizada, insiste na primeira abertura (só modo local) */
  if(!CLOUD_ON && !FS.pasta) setTimeout(() => {
    toast('Ative o backup automático para não depender só deste navegador.', 'alerta');
  }, 1200);
})();
</script>
