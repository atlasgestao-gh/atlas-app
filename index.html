function norm(s){
  return (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
}
function esc(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function uid(p){ return p + Math.random().toString(36).slice(2,9); }
function parseISO(iso){
  if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return null;
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d); dt.setHours(0,0,0,0);
  return isNaN(dt) ? null : dt;
}
function fmtDate(iso){ const d = parseISO(iso); return d ? d.toLocaleDateString('pt-BR') : '—'; }
function isoToday(){ return toISO(HOJE); }
function toISO(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(iso, n){
  const d = parseISO(iso); if(!d) return '';
  d.setDate(d.getDate()+n); return toISO(d);
}
function diasPara(iso){
  const d = parseISO(iso); if(!d) return null;
  return Math.round((d - HOJE) / 86400000);
}
/* inputs type=date/month do Chrome ignoram texto colado — intercepta o paste,
   entende dd/mm/aaaa, dd-mm-aaaa ou aaaa-mm-dd e preenche o valor certo */
function colarData(ev){
  const el = ev.target;
  const texto = ((ev.clipboardData || window.clipboardData || {}).getData
    ? (ev.clipboardData || window.clipboardData).getData('text') : '').trim();
  if(!texto) return;
  let iso = '';
  let m = texto.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) iso = m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  else{
    m = texto.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if(m){ const ano = m[3].length===2 ? '20'+m[3] : m[3]; iso = ano+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); }
  }
  if(!iso) return;
  ev.preventDefault();
  el.value = el.type === 'month' ? iso.slice(0,7) : iso;
  el.dispatchEvent(new Event('input', { bubbles:true }));
  el.dispatchEvent(new Event('change', { bubbles:true }));
}

/* ═══════════════════════════════════════════════════════════════════
   PERSISTÊNCIA EM CAMADAS

   1. Arquivo dados.json na pasta do Google Drive  ← fonte da verdade
   2. IndexedDB (cópia local, sem limite de 5 MB do localStorage)
   3. localStorage (terceira cópia, só enquanto couber)

   Se a pasta ainda não foi autorizada, o sistema funciona normalmente
   pelas camadas 2 e 3 e avisa em faixa vermelha que está desprotegido.
   ═══════════════════════════════════════════════════════════════════ */

  pasta: null,        // FileSystemDirectoryHandle
  permissao: false,
  ultimoWrite: null,  // ISO da última gravação em arquivo

/* ---------- IndexedDB (chave/valor) ---------- */
let _idb = null;
function idbOpen(){
  if(_idb) return Promise.resolve(_idb);
  return new Promise((ok, err) => {
    const r = indexedDB.open('atlas_sst', 1);
    r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
    r.onsuccess = () => { _idb = r.result; ok(_idb); };
    r.onerror = () => err(r.error);
  });
}
function idbGet(k){
  return idbOpen().then(db => new Promise((ok, err) => {
    const r = db.transaction('kv','readonly').objectStore('kv').get(k);
    r.onsuccess = () => ok(r.result); r.onerror = () => err(r.error);
  })).catch(() => null);
}
function idbSet(k, v){
  return idbOpen().then(db => new Promise((ok, err) => {
    const t = db.transaction('kv','readwrite');
    t.objectStore('kv').put(v, k);
    t.oncomplete = () => ok(true); t.onerror = () => err(t.error);
  })).catch(e => { console.warn('IndexedDB', e); return false; });
}

  migrarExames(d);
  migrarEmissoes(d);
  migrarPrecos(d);   /* depois de migrarEmissoes: precisa do status Realizado já normalizado */
  migrarAsos(d);
  migrarDuplicidadesCadastro(d);
  migrarClinicas(d);
  migrarDocs(d);
  migrarAtestados(d);
  migrarNomesMaiusculos(d);
  migrarNaoCompareceu(d);
  migrarDemissionais(d);
  migrarDataAso(d);
  return d;
}

/* Prestadores (gestoras, ex.: Arys) e clínicas credenciadas sob a sua guarda.
   A Arys gerencia as clínicas; o pagamento é feito à Arys. As unidades apenas
   apontam em qual clínica credenciada o colaborador realiza o exame. */
function migrarClinicas(d){
  if(d.clinicasVersao === 1) return;
  d.prestadores = d.prestadores || [];
  d.clinicas = d.clinicas || [];
  let arys = d.prestadores.find(p => norm(p.nome).includes('ARYS'));
  if(!arys){
    arys = { id: uid('pr'), nome:'Arys', cnpj:'', email:'', obs:'Gestora das clínicas credenciadas — pagamento é feito à Arys' };
    d.prestadores.push(arys);
  }
  const porNome = {};
  d.clinicas.forEach(c => { porNome[norm(c.nome)] = c; });
  (d.unidades||[]).forEach(u => {
    const c = u.clinica;
    if(c && c.nome){
      const k = norm(c.nome);
      let cli = porNome[k];
      if(!cli){
        cli = { id: uid('cli'), nome:c.nome, endereco:c.endereco||'', cidade:u.cidade||'', uf:u.uf||'',
                cep:c.cep||'', email:c.email||'', prestadorId: arys.id };
        porNome[k] = cli; d.clinicas.push(cli);
      }
      if(!u.clinicaId) u.clinicaId = cli.id;
    }
  });
  d.clinicasVersao = 1;
}
const prestador = id => (DB.prestadores||[]).find(p => p.id === id) || null;
const clinica   = id => (DB.clinicas||[]).find(c => c.id === id) || null;
function clinicaDaUnidade(u){
  if(!u) return null;
  return clinica(u.clinicaId) || (u.clinica && u.clinica.nome ? u.clinica : null);
}
function nomeClinicaUnidade(u){ const c = clinicaDaUnidade(u); return c ? c.nome : '—'; }
function baseValida(d){ return d && Array.isArray(d.colaboradores) && Array.isArray(d.unidades); }

/* ---------- leitura no arranque ---------- */
async function bootStorage(){
  /* nada aqui pode travar o arranque — tudo com limite de tempo */
  try{ if(navigator.storage && navigator.storage.persist) await comLimite(navigator.storage.persist(), 2000); }catch(e){}

  try{
    FS.pasta = await comLimite(idbGet('pastaBackup'), 5000);
    if(FS.pasta) FS.permissao = (await comLimite(FS.pasta.queryPermission({ mode:'readwrite' }), 3000)) === 'granted';
  }catch(e){ FS.pasta = null; }

  let doNuvem = null, doArquivo = null, doIdb = null, doLs = null;
  if(CLOUD_ON) doNuvem = await comLimite(nuvemLer(), 12000);
  if(FS.permissao) doArquivo = await lerArquivoDados();
  doIdb = await comLimite(idbGet('db'), 8000);
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) doLs = JSON.parse(raw);
  }catch(e){}

  /* vence a cópia com o carimbo de salvamento mais recente */
  const candidatos = [
    { fonte:'nuvem', d:doNuvem },
    { fonte:'arquivo no Drive', d:doArquivo },
    { fonte:'IndexedDB', d:doIdb },
    { fonte:'localStorage', d:doLs }
  ].filter(x => baseValida(x.d));

  if(!candidatos.length){
    DB = seedFresh();
    DB.meta.fonteInicial = CLOUD_ON ? 'base vazia (nuvem) — restaure um backup' : 'base original das planilhas';
    await gravarTudo({ arquivo:true });
    if(CLOUD_ON) nuvemGravar(true);
    return;
  }
  candidatos.sort((a,b) => ((b.d.meta&&b.d.meta.salvoEm)||'').localeCompare((a.d.meta&&a.d.meta.salvoEm)||''));
  DB = candidatos[0].d;
  DB.meta = DB.meta || {};
  DB.meta.fonteInicial = candidatos[0].fonte;
  migrarLaudos(DB);   /* converte bases salvas em formatos anteriores */
  dedupeLaudos(DB);
  migrarLaudoStatus(DB);
  migrarCargos(DB);
  migrarExames(DB);
  migrarEmissoes(DB);
  migrarPrecos(DB);
  migrarAsos(DB);
  migrarDuplicidadesCadastro(DB);
  migrarClinicas(DB);
  migrarDocs(DB);
  migrarAtestados(DB);
  migrarNomesMaiusculos(DB);
  migrarNaoCompareceu(DB);
  migrarDemissionais(DB);
  migrarDataAso(DB);

  /* nuvem ligada mas a cópia mais recente veio de outra camada → sobe p/ nuvem */
  if(CLOUD_ON && candidatos[0].fonte !== 'nuvem') nuvemGravar(true);

  /* se as cópias divergem, registra para exibir no painel de backup */
  const carimbos = candidatos.map(c => (c.d.meta&&c.d.meta.salvoEm)||'—');
  DB.meta.divergencia = new Set(carimbos).size > 1 ? candidatos.map((c,i) => c.fonte+': '+carimbos[i]).join(' · ') : '';
}

async function lerArquivoDados(){
  try{
    const fh = await FS.pasta.getFileHandle(ARQ_DADOS);
    const f = await fh.getFile();
    FS.carimboLido = f.lastModified;
    const d = JSON.parse(await f.text());
    return baseValida(d) ? d : null;
  }catch(e){
    if(e.name !== 'NotFoundError') FS.ultimoErro = e.message;
    return null;
  }
}

/* ---------- gravação ---------- */
let timerArquivo = null;

function save(opts){
  DB.meta = DB.meta || {};
  DB.meta.salvoEm = new Date().toISOString();

  idbSet('db', DB);                                   /* camada 2 — imediata */
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }   /* camada 3 */
  catch(e){ DB.meta.localStorageCheio = true; }

  if(CLOUD_ON) nuvemGravar(opts && opts.jaJa);        /* camada 0 — nuvem */

  /* camada 1 — arquivo, com atraso para não gravar a cada tecla */
  if(FS.permissao){
    clearTimeout(timerArquivo);
    timerArquivo = setTimeout(() => gravarArquivo(), (opts && opts.jaJa) ? 0 : 12000);
  }
  carimboSalvamento();
}

/* grava imediatamente — usado antes de ações destrutivas e ao fechar a aba */
async function gravarTudo(o){
  await idbSet('db', DB);
  if(FS.permissao && o && o.arquivo) await gravarArquivo();
}

async function gravarArquivo(){
  if(!FS.permissao || !FS.pasta) return false;
  if(FS.gravando){ FS.pendente = true; return false; }
  FS.gravando = true;
  try{
    /* alguém alterou o arquivo por fora (outra máquina)? */
    try{
      const f = await (await FS.pasta.getFileHandle(ARQ_DADOS)).getFile();
      if(FS.carimboLido && f.lastModified > FS.carimboLido + 2000){
        const outro = JSON.parse(await f.text());
        const quando = outro.meta && outro.meta.salvoEm ? new Date(outro.meta.salvoEm).toLocaleString('pt-BR') : '?';
        if(!confirm('O arquivo de dados no Drive foi alterado por fora desta janela (salvo em ' + quando + ').\n\n' +
                    'OK = sobrescrever com o que está nesta tela.\nCancelar = não gravar agora (faça um backup manual antes).')){
          FS.gravando = false; return false;
        }
      }
    }catch(e){ /* arquivo ainda não existe */ }

    const texto = JSON.stringify(DB);
    /* createWritable grava num arquivo temporário e só troca no close() — à prova de queda de energia */
    const fh = await FS.pasta.getFileHandle(ARQ_DADOS, { create:true });
    const w = await fh.createWritable();
    await w.write(texto); await w.close();
    /* confere se o que ficou no disco é o que foi mandado gravar */
    const conf = await fh.getFile();
    const lido = await conf.text();
    if(lido.length !== texto.length || !baseValida(JSON.parse(lido)))
      throw new Error('verificação pós-gravação falhou — o arquivo no disco não confere');
    FS.carimboLido = conf.lastModified;

    await gravarSnapshotDiario(texto);

    FS.ultimoWrite = new Date().toISOString();
    FS.ultimoErro = null;
    await idbSet('ultimoWrite', FS.ultimoWrite);
    carimboSalvamento();
    return true;
  }catch(e){
    FS.ultimoErro = e.message;
    if(e.name === 'NotAllowedError'){ FS.permissao = false; renderBanner(); }
    toast('Falha ao gravar o backup em arquivo: ' + e.message, 'erro');
    return false;
  }finally{
    FS.gravando = false;
    if(FS.pendente){ FS.pendente = false; setTimeout(() => gravarArquivo(), 500); }
  }
}

/* uma cópia por dia, mantendo os últimos 60 dias + o dia 1º de cada mês para sempre */
async function gravarSnapshotDiario(texto){
  try{
    const hist = await FS.pasta.getDirectoryHandle(PASTA_HIST, { create:true });
    const nome = 'atlas-sst-' + isoToday() + '.json';
    const fh = await hist.getFileHandle(nome, { create:true });
    const w = await fh.createWritable(); await w.write(texto); await w.close();

    const arquivos = [];
    for await (const [n, h] of hist.entries()){
      if(h.kind === 'file' && /^atlas-sst-\d{4}-\d{2}-\d{2}\.json$/.test(n)) arquivos.push(n);
    }
    arquivos.sort();
    const excedente = arquivos.slice(0, Math.max(0, arquivos.length - MANTER_DIARIOS));
    for(const n of excedente){
      if(n.endsWith('-01.json')) continue;          /* guarda o 1º de cada mês */
      await hist.removeEntry(n).catch(()=>{});
    }
  }catch(e){ console.warn('snapshot diário', e); }
}

/* ---------- autorização da pasta ---------- */
async function ativarPasta(){
  try{
    const h = await window.showDirectoryPicker({ mode:'readwrite', startIn:'documents' });
    if((await h.requestPermission({ mode:'readwrite' })) !== 'granted'){
      toast('Permissão de escrita não concedida.', 'erro'); return;
    }
    FS.pasta = h; FS.permissao = true; FS.ultimoErro = null;
    await idbSet('pastaBackup', h);

    /* já existe dados.json nessa pasta? oferece carregar em vez de sobrescrever */
    const existente = await lerArquivoDados();
    if(existente && existente !== DB){
      const q = existente.meta && existente.meta.salvoEm ? new Date(existente.meta.salvoEm).toLocaleString('pt-BR') : '?';
      if(confirm('Já existe um dados.json nessa pasta (salvo em ' + q + ', ' +
                 existente.colaboradores.length + ' colaboradores).\n\n' +
                 'OK = carregar esses dados (use ao trocar de máquina).\n' +
                 'Cancelar = manter o que está nesta tela e sobrescrever o arquivo.')){
        DB = existente; await idbSet('db', DB);
        toast('Dados carregados do arquivo do Drive.');
        renderBanner(); go(rota); return;
      }
    }
    await gravarArquivo();
    toast('Backup automático ativado.');
    renderBanner(); if(rota === 'backup') viewBackup();
  }catch(e){
    if(e.name === 'AbortError') return;             /* usuária fechou o seletor */
    FS.ultimoErro = e.message;
    toast('Não foi possível ativar: ' + e.message, 'erro');
  }
}
async function reativarPermissao(){
  if(!FS.pasta){ return ativarPasta(); }
  try{
    const p = await FS.pasta.requestPermission({ mode:'readwrite' });
    if(p === 'granted'){
      FS.permissao = true;
      const doArquivo = await lerArquivoDados();
      /* o arquivo pode estar mais novo que esta aba (outra máquina) */
      if(baseValida(doArquivo) && ((doArquivo.meta&&doArquivo.meta.salvoEm)||'') > ((DB.meta&&DB.meta.salvoEm)||'')){
        if(confirm('O arquivo no Drive está mais recente que os dados desta janela. Carregar a versão do Drive?')){
          DB = doArquivo; await idbSet('db', DB);
        }
      }
      await gravarArquivo();
      toast('Backup automático reativado.');
      renderBanner(); go(rota);
    }else{
      toast('Permissão negada.', 'erro');
    }
  }catch(e){ toast('Erro: ' + e.message, 'erro'); }
}
async function desativarPasta(){

/* ---------- desfazer (últimos 10 estados) ---------- */
/* nunca deixa uma ação do usuário travar esperando o IndexedDB */
function comLimite(promessa, ms){
  return Promise.race([promessa, new Promise(r => setTimeout(() => r(null), ms || 3000))]);
}
async function guardarSnapshotLocal(motivo){
  try{
    const l = (await comLimite(idbGet('snapshots'))) || [];
    l.push({ em: new Date().toISOString(), motivo, dados: JSON.stringify(DB) });
    await comLimite(idbSet('snapshots', l.slice(-10)));
  }catch(e){ console.warn('snapshot', e); }
}
async function listarSnapshots(){ return (await idbGet('snapshots')) || []; }
async function restaurarSnapshot(i){
  const l = await listarSnapshots();
  const s = l[i]; if(!s) return;
  if(!confirm('Voltar ao estado de ' + new Date(s.em).toLocaleString('pt-BR') + ' (' + s.motivo + ')?')) return;
  await guardarSnapshotLocal('antes de desfazer');
  DB = JSON.parse(s.dados);
  save({ jaJa:true }); go('backup');
  toast('Estado restaurado.');
}

/* vincula eventos eSocial importados ao ASO correspondente */
function vincularEsocial(d){
  const soDigitos = s => (s||'').replace(/\D/g,'');
  const porNome = {}, porCpf = {};
  d.colaboradores.forEach(c => {
    (porNome[norm(c.nome)] = porNome[norm(c.nome)] || []).push(c);
    const cpf = soDigitos(c.cpf);
    if(cpf.length === 11) (porCpf[cpf] = porCpf[cpf] || []).push(c);
  });
  /* o CPF é mais confiável que o nome — as planilhas divergem em SOUSA/SOUZA, acentos etc. */
  const acha = (nome, cpf) => (porCpf[soDigitos(cpf)] || [])[0] || (porNome[norm(nome)] || [])[0];

  (d.esocial2220||[]).forEach(ev => {
    const c = acha(ev.nome, ev.cpf); if(!c) return;
    const asos = d.asos.filter(a => a.colaboradorId === c.id);
    const alvo = asos.find(a => a.dataExame === ev.dataASO) || asos[0];
    if(!alvo || (alvo.s2220 && alvo.s2220.recibo)) return;
    alvo.s2220 = { recibo: ev.recibo, idArquivo: ev.idArquivo, dataEnvio: ev.dataEnvio, status: ev.status };
    if(!alvo.resultado) alvo.resultado = ev.resultado || '';
    ev.vinculado = true;
  });
  (d.esocial2240||[]).forEach(ev => {
    const c = acha(ev.nome, ev.cpf); if(!c) return;
    const asos = d.asos.filter(a => a.colaboradorId === c.id);
    const alvo = asos[0];
    if(!alvo || (alvo.s2240 && alvo.s2240.recibo)) return;
    alvo.s2240 = { recibo: ev.recibo, idArquivo: ev.idArquivo, dataEnvio: ev.dataEnvio, status: ev.status };
    ev.vinculado = true;
  });
}

/* ─── sincronizar com a planilha ───
   Compara a base viva com a planilha embutida e traz SÓ o que falta.
   Não altera nem apaga nada do que já existe — ao contrário do "recarregar". */
function chaveColabSinc(c){
  const d = String(c.cpf||'').replace(/\D/g,'');
  return d.length === 11 ? 'cpf:'+d : 'nome:'+norm(c.nome);
}
function chaveEmissaoSinc(e){
  return [norm(e.colaborador), e.unidadeId||'', e.dataLab||'', e.dataClinico||'', e.tipoExame||''].join('|');
}
function analisarSincronia(){
  const s = seedFresh();
  const atuais = new Set(DB.colaboradores.map(chaveColabSinc));
  const colabNovos = s.colaboradores.filter(c => !atuais.has(chaveColabSinc(c)));

  /* emissões repetem para o mesmo colaborador — compara por contagem, não por presença */
  const cont = {};
  DB.emissoes.forEach(e => { const k = chaveEmissaoSinc(e); cont[k] = (cont[k]||0) + 1; });
  const emNovas = [];
  s.emissoes.forEach(e => {
    const k = chaveEmissaoSinc(e);
    if(cont[k] > 0) cont[k]--; else emNovas.push(e);
  });
  const idsNovos = new Set(colabNovos.map(c => c.id));
  const asosNovos = (s.asos||[]).filter(a => idsNovos.has(a.colaboradorId));
  return { s, colabNovos, emNovas, asosNovos };
}

        <button onclick="closeModal()" class="px-4 py-2 text-sm rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-50">Cancelar</button>

async function aplicarSincronia(){
  const a = analisarSincronia();
  if(!a.colabNovos.length && !a.emNovas.length){ toast('Nada a incluir.', 'alerta'); return; }
  await guardarSnapshotLocal('antes de sincronizar com a planilha');
  const mapa = {};
  a.colabNovos.forEach(c => {
    const novo = Object.assign({}, c, { id: uid('cl') });
    mapa[c.id] = novo.id;
    DB.colaboradores.push(novo);
  });
  let nAso = 0;
  a.asosNovos.forEach(x => {
    if(!mapa[x.colaboradorId]) return;
    DB.asos.push(Object.assign({}, x, { id: uid('as'), colaboradorId: mapa[x.colaboradorId] }));
    nAso++;
  });
  a.emNovas.forEach(e => DB.emissoes.push(Object.assign({}, e, { id: uid('em') })));
  save({ jaJa:true }); closeModal(); go(rota);
  toast(`Incluídos: ${a.colabNovos.length} colaborador(es), ${a.emNovas.length} pedido(s) e ${nAso} ASO(s). ` +
        `Ponto de retorno guardado em "Backup e segurança".`);
}

function baixar(nome, conteudo, mime){
  const b = new Blob(['﻿' + conteudo], { type: (mime||'text/plain') + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCSV(nome, headers, linhas){
  const q = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
  const csv = [headers.map(q).join(';')].concat(linhas.map(l => l.map(q).join(';'))).join('\r\n');
  baixar(nome + '-' + isoToday() + '.csv', csv, 'text/csv');
  toast('Exportado: ' + nome + '.csv');
}

const uni    = id => DB.unidades.find(u => u.id === id);
const emp    = id => DB.empresas.find(e => e.id === id);
const colab  = id => DB.colaboradores.find(c => c.id === id);
const uniNome = id => { const u = uni(id); return u ? u.nome : '—'; };
const empDaUnidade = id => { const u = uni(id); return u ? emp(u.empresaId) : null; };

/* há um único ASO (vigente) por colaborador; os anteriores ficam em a.historico */
function asoVigente(colaboradorId){
  return DB.asos.find(a => a.colaboradorId === colaboradorId) || null;
}
function colaboradoresAtivos(){ return DB.colaboradores.filter(c => c.status === 'Ativo'); }

/* acha o colaborador de uma emissão pelo nome (o campo é texto livre) */
function colabDaEmissao(e){
  return DB.colaboradores.find(c => norm(c.nome) === norm(e.colaborador)) || null;
}

/* Registra/atualiza o ASO a partir de um exame que passou a "Realizado".
   Não duplica: se o colaborador já tem ASO, o vigente vira histórico e o novo assume.
   Idempotente por emissão — reprocessar a mesma emissão não cria duplicata. */
function sincronizarAsoDeEmissao(e, opts){
  opts = opts || {};
  if(e.status !== 'REALIZADO') return null;
  const c = colabDaEmissao(e);
  if(!c) return { erro:'sem-colaborador' };

  const dataExame = e.dataClinico || e.dataLab || isoToday();
  const vencimento = addDays(dataExame, 365);
  const aso = asoVigente(c.id);

  if(aso && aso.origemEmissaoId === e.id){
    /* já veio desta emissão: apenas atualiza os campos, sem gerar histórico */
    aso.tipo = e.tipoExame || aso.tipo;
    aso.dataExame = dataExame;
    aso.vencimento = vencimento;
    aso.medico = e.medico || aso.medico;
    if(e.resultado) aso.resultado = e.resultado;
    aso.unidadeId = e.unidadeId || aso.unidadeId;
    return { aso, acao:'atualizado' };
  }

  if(aso){
    /* mesma data de exame já registrada por outra via: evita histórico redundante */
    if(aso.dataExame === dataExame && norm(aso.tipo) === norm(e.tipoExame||'')){
      aso.origemEmissaoId = e.id;
      if(e.resultado) aso.resultado = e.resultado;
      return { aso, acao:'vinculado' };
    }
    /* empurra o vigente para o histórico e cria o novo */
    aso.historico = [{
      tipo:aso.tipo, dataExame:aso.dataExame, vencimento:aso.vencimento,
      resultado:aso.resultado||'', medico:aso.medico||'',
      s2220:aso.s2220||'', s2240:aso.s2240||'', origemEmissaoId:aso.origemEmissaoId||''
    }].concat(aso.historico || []);
    aso.tipo = e.tipoExame || '';
    aso.dataExame = dataExame;
    aso.vencimento = vencimento;
    aso.medico = e.medico || '';
    aso.resultado = e.resultado || '';
    aso.unidadeId = e.unidadeId || c.unidadeId;
    aso.s2220 = ''; aso.s2240 = '';
    aso.origemEmissaoId = e.id;
    return { aso, acao:'renovado' };
  }

  /* primeiro ASO do colaborador */
  const novo = {
    id: uid('as'), colaboradorId: c.id, unidadeId: e.unidadeId || c.unidadeId,
    tipo: e.tipoExame || '', dataExame, vencimento,
    resultado: e.resultado || '', medico: e.medico || '', s2220:'', s2240:'',
    origemEmissaoId: e.id, historico: []
  };
  DB.asos.push(novo);
  return { aso:novo, acao:'criado' };
}

      const ov = typeof o === 'object' ? o.v : o, ol = typeof o === 'object' ? o.l : o;

    inner = `<textarea name="${f.name}" rows="${f.rows||3}" class="${base}">${esc(val)}</textarea>`;

          <input type="checkbox" name="gx_${t}" value="${esc(e.nome)}" ${marcado[t].includes(norm(e.nome))?'checked':''}

    return f.html || '';
  } else if(f.type === 'painel'){
    return `<div id="${f.name}" class="${f.col||'sm:col-span-2'}"></div>`;
  } else if(f.type === 'datalist'){
    inner = `<input name="${f.name}" list="dl_${f.name}" value="${esc(val)}" autocomplete="off"

function openForm({ title, fields, values = {}, onSave, largura = 'max-w-3xl', afterRender = null }){
  $('#modalTitle').textContent = title;

    `relative mx-auto my-4 sm:my-10 w-[95%] ${largura} bg-white rounded-xl shadow-2xl max-h-[92vh] flex flex-col fade-in`;

      ? `<p class="sm:col-span-2 text-xs font-semibold uppercase tracking-wide text-slate-400 border-b border-slate-200 pb-1 mt-2">${esc(f.label)}</p>`
      : campoHTML(f, values[f.name])).join('')}</form>`;
  $('#modalFoot').innerHTML = `
    <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100">Cancelar</button>
    <button onclick="submitForm()" class="px-4 py-2 rounded-lg text-sm bg-accent text-white hover:bg-blue-700">Salvar</button>`;
  modalSave = () => {
    const fd = new FormData($('#modalForm'));
    const out = {};
    fields.forEach(f => {
      if(f.type === 'sep' || f.type === 'painel' || f.type === 'html') return;
      if(f.type === 'gradeExames'){
        out[f.name] = {};
        ['ADMISSIONAL','PERIODICO','TROCA_FUNCAO','RETORNO','DEMISSIONAL']
          .forEach(t => { out[f.name][t] = fd.getAll('gx_' + t); });
        return;
      }
      if(f.type === 'checkbox') out[f.name] = fd.get(f.name) === 'on';
      else if(f.type === 'multi') out[f.name] = fd.getAll(f.name);
      else if(f.type === 'number') out[f.name] = fd.get(f.name) === '' ? 0 : Number(fd.get(f.name));
      else out[f.name] = (fd.get(f.name) || '').toString().trim();
    });
    const faltando = fields.filter(f => f.req && (f.type === 'multi' ? !out[f.name].length : !out[f.name]));
    if(faltando.length){ toast('Preencha: ' + faltando.map(f => f.label).join(', '), 'erro'); return; }
    onSave(out);
  };
  $('#modal').classList.remove('hidden');
  if(afterRender) afterRender($('#modalForm'));
}

    class="px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-accent/40">
    <option value="">${esc(label)}</option>
    ${opcoes.map(o => `<option value="${esc(o.v)}" ${o.v===valor?'selected':''}>${esc(o.l)}</option>`).join('')}
  </select>`;
}
function botao(txt, icon, onclick, cls='bg-accent text-white hover:bg-blue-700'){
  return `<button onclick="${onclick}" class="px-3 py-2 rounded-lg text-sm flex items-center gap-2 whitespace-nowrap ${cls}">
    <i class="fa-solid ${icon}"></i><span class="hidden sm:inline">${esc(txt)}</span></button>`;
}
function opcoesUnidades(){
  return DB.unidades.map(u => ({ v:u.id, l:u.nome }));
}
function opcoesEmpresas(){
  return DB.empresas.map(e => ({ v:e.id, l:e.nome }));
}
/* tamanho de página global — todas as grids usam 10 (ou 20) linhas por página */
let PAGE_SIZE = 10;
function setPageSize(n){ PAGE_SIZE = Number(n) || 10; if(rota) go(rota); }

/* fatia uma lista pela página atual usando PAGE_SIZE */
function paginar(lista, page){
  const paginas = Math.ceil(lista.length / PAGE_SIZE) || 1;
  const p = Math.min(page || 1, paginas);
  return { itens: lista.slice((p-1)*PAGE_SIZE, p*PAGE_SIZE), p, paginas };
}

function paginador(total, page, fn){
  const paginas = Math.ceil(total / PAGE_SIZE) || 1;
  const p = Math.min(page, paginas);
  const seletor = `<label class="flex items-center gap-1">Linhas
    <select onchange="setPageSize(this.value)" class="border border-slate-300 rounded px-1.5 py-0.5">
      <option value="10" ${PAGE_SIZE===10?'selected':''}>10</option>
      <option value="20" ${PAGE_SIZE===20?'selected':''}>20</option>
    </select></label>`;
  if(paginas <= 1)
    return `<div class="flex items-center justify-between gap-2 px-4 py-3 text-xs text-slate-500 no-print">
      <span>${total} registro(s)</span>${seletor}</div>`;
  const nums = [];
  const ini = Math.max(1, p-2), fim = Math.min(paginas, p+2);
  for(let i=ini;i<=fim;i++) nums.push(i);
  return `<div class="flex flex-wrap items-center justify-between gap-2 px-4 py-3 text-xs text-slate-600 no-print">
    <div class="flex items-center gap-3"><span>${total} registro(s) · página ${p} de ${paginas}</span>${seletor}</div>
    <div class="flex gap-1">
      <button ${p<=1?'disabled':''} onclick="${fn}(1)" class="px-2 py-1 rounded border border-slate-300 disabled:opacity-40 hover:bg-slate-100" title="Primeira"><i class="fa-solid fa-angles-left"></i></button>
      <button ${p<=1?'disabled':''} onclick="${fn}(${p-1})" class="px-2 py-1 rounded border border-slate-300 disabled:opacity-40 hover:bg-slate-100"><i class="fa-solid fa-chevron-left"></i></button>
      ${nums.map(i => `<button onclick="${fn}(${i})" class="px-2.5 py-1 rounded border ${i===p?'bg-accent text-white border-accent':'border-slate-300 hover:bg-slate-100'}">${i}</button>`).join('')}
      <button ${p>=paginas?'disabled':''} onclick="${fn}(${p+1})" class="px-2 py-1 rounded border border-slate-300 disabled:opacity-40 hover:bg-slate-100"><i class="fa-solid fa-chevron-right"></i></button>
      <button ${p>=paginas?'disabled':''} onclick="${fn}(${paginas})" class="px-2 py-1 rounded border border-slate-300 disabled:opacity-40 hover:bg-slate-100" title="Última"><i class="fa-solid fa-angles-right"></i></button>
    </div></div>`;
}
function vazio(msg){
  return `<tr><td colspan="20" class="px-4 py-10 text-center text-sm text-slate-400">
    <i class="fa-regular fa-folder-open text-2xl block mb-2"></i>${esc(msg)}</td></tr>`;
}

/* ═══════════════════════════ 1. DASHBOARD ═══════════════════════════ */
const UIDash = { escopo:'ativos' };

function dadosDashboard(){
  const somenteAtivos = UIDash.escopo === 'ativos';
  const colabs = somenteAtivos ? colaboradoresAtivos() : DB.colaboradores;
  const ids = new Set(colabs.map(c => c.id));

  const vigentes = [];
  colabs.forEach(c => { const a = asoVigente(c.id); if(a) vigentes.push({ aso:a, colab:c }); });

  const st = { emdia:0, avencer:0, vencido:0, sem:0 };
  vigentes.forEach(v => st[semaforo(v.aso.vencimento).key]++);

  const laudosSt = { emdia:0, avencer:0, vencido:0, sem:0, elaboracao:0 };
  DB.laudos.forEach(l => laudosSt[laudoSituacao(l).key]++);

  return {
    colabs, ids, vigentes, st, laudosSt,
    ativos: DB.colaboradores.filter(c => c.status === 'Ativo').length,
    inativos: DB.colaboradores.filter(c => c.status !== 'Ativo').length,
    trocaFuncao: DB.asos.filter(a => a.tipo === 'TROCA_FUNCAO' && (!somenteAtivos || ids.has(a.colaboradorId))).length
  };
}

function alertasCriticos(){
  const d = dadosDashboard();
  const linhas = [];
  d.vigentes.forEach(v => {
    const s = semaforo(v.aso.vencimento);
    if(s.key === 'vencido' || s.key === 'avencer'){
      linhas.push({
        tipo:'ASO', ref:v.aso.id, nome:v.colab.nome, unidadeId:v.colab.unidadeId,
        detalhe: tipoLabel(v.aso.tipo) + ' · ' + (v.colab.funcao || '—'),
        vencimento:v.aso.vencimento, dias:s.dias, sem:s,
        acao:`agendarDeAlerta('${v.colab.id}')`, acaoLabel:'Agendar exame', acaoIcon:'fa-calendar-plus'
      });
    }
  });
  DB.laudos.forEach(l => {
    const s = laudoSituacao(l);
    const a = l.atual;
    if(l.renovacao){
      /* já está sendo tratado — só entra na lista se o laudo vigente já venceu/está vencendo
         ou se a solicitação está parada há mais de 30 dias na clínica */
      const parado = diasDesde(l.renovacao.solicitadoEm);
      const urgente = s.base.key === 'vencido' || s.base.key === 'avencer';
      if(!urgente && !(parado !== null && parado > 30)) return;
      linhas.push({
        tipo:'Laudo', ref:l.id, nome: docsLabel(l.renovacao.documentos), unidadeId:l.unidadeId,
        detalhe: 'Em elaboração há ' + parado + ' dia(s) · ' + (l.renovacao.clinica || 'clínica não informada'),
        vencimento: a ? a.vencimento : '', dias: s.dias, sem: s,
        acao:`concluirRenovacao('${l.id}')`, acaoLabel:'Registrar entrega', acaoIcon:'fa-check'
      });
      return;
    }
    if(s.key === 'vencido' || s.key === 'avencer'){
      linhas.push({
        tipo:'Laudo', ref:l.id, nome: a ? docsLabel(a.documentos) : 'Laudo', unidadeId:l.unidadeId,
        detalhe:'Clínica: ' + ((a && a.clinica) || '—'),
        vencimento: a ? a.vencimento : '', dias:s.dias, sem:s,
        acao:`solicitarRenovacao('${l.id}')`, acaoLabel:'Renovar laudo', acaoIcon:'fa-rotate'
      });
    }
  });
  return linhas.sort((a,b) => (a.dias ?? 9e9) - (b.dias ?? 9e9));
}

function mesPadrao(){
  const el = document.getElementById('mesGrafico');
  if(el && el.value) return el.value;
  const datas = DB.emissoes.map(e => e.dataClinico || e.dataLab).filter(Boolean).sort();
  return datas.length ? datas[datas.length-1].slice(0,7) : isoToday().slice(0,7);
}
function setEscopo(v){ UIDash.escopo = v; viewDashboard(); }
function irParaAsos(tipo, sem){
  UIAso.tipo = tipo || ''; UIAso.sem = sem || ''; UIAso.q = ''; UIAso.uni = ''; UIAso.page = 1;
  UIAso.status = UIDash.escopo === 'ativos' ? 'Ativo' : '';
  go('asos');
}
function irParaLaudos(sem){ UILaudo.sem = sem || ''; UILaudo.page = 1; go('laudos'); }

/* exames que já saíram daqui mas ainda não voltaram prontos da Arys —
   é a lista para cobrar o fornecedor */
function emissoesPendentesFornecedor(){
  return DB.emissoes.filter(e => e.status === 'SOLICITADO' || e.status === 'AGENDADO')
    .sort((a, b) => {
      if(a.status !== b.status) return a.status === 'AGENDADO' ? -1 : 1;
      return (a.dataClinico || '9999').localeCompare(b.dataClinico || '9999');
    });
}
function agendarDeAlerta(colaboradorId){
  const c = colab(colaboradorId);
  const a = asoVigente(colaboradorId);
  novaEmissao({ colaborador:c.nome, unidadeId:c.unidadeId, tipoExame: a && a.tipo === 'DEMISSIONAL' ? 'PERIODICO' : (a ? a.tipo : 'PERIODICO') });
}

/* ═══════════════════════ 1b. ACOMPANHAMENTOS ═══════════════════════
   junta os exames parados no fornecedor com os alertas de ASO num só painel,
   pesquisável por nome — separado do painel geral a pedido da Jessica */
const UIAcomp = { q:'' };
function itensAcompanhamento(){
  const asoItens = alertasCriticos().filter(a => a.tipo === 'ASO').map(a => ({
    origem:'ASO', colaborador:a.nome, unidadeId:a.unidadeId,
    detalhe: a.detalhe + ' · vence ' + fmtDate(a.vencimento),
    situacaoLabel:a.sem.label, situacaoCls:a.sem.cls, dias:a.dias,
    acaoLabel:a.acaoLabel, acaoIcon:a.acaoIcon, acao:a.acao
  }));
  const fornItens = emissoesPendentesFornecedor().map(e => ({
    origem:'Fornecedor', colaborador:e.colaborador, unidadeId:e.unidadeId,
    detalhe: tipoLabel(e.tipoExame) + (e.dataClinico ? ' · agendado ' + fmtDate(e.dataClinico) : ''),
    situacaoLabel:FLUXO_LABEL[e.status], situacaoCls:corFluxo(e.status), dias:null,
    acaoLabel:'Editar', acaoIcon:'fa-pen', acao:`editarEmissao('${e.id}')`
  }));
  /* laudo pedido à clínica e ainda não entregue também é coisa a cobrar */
  const laudoItens = DB.laudos.filter(l => l.atual && l.atual.pagamento === 'Solicitado').map(l => ({
    origem:'Laudo', colaborador: docsLabel(l.atual.documentos), unidadeId:l.unidadeId,
    detalhe: 'Clínica: ' + (l.atual.clinica || '—'),
    situacaoLabel:'Solicitado', situacaoCls:'bg-amber-100 text-amber-700', dias:null,
    acaoLabel:'Abrir laudo', acaoIcon:'fa-file-shield', acao:`editarLaudo('${l.id}')`
  }));
  const q = norm(UIAcomp.q);
  return asoItens.concat(fornItens, laudoItens).filter(x => !q || norm(x.colaborador).includes(q));
}
/* junta numa linha só tudo do mesmo colaborador (mesma pessoa + unidade):
   quem está com ASO atrasado e o exame já solicitado aparece uma vez, não duas */
function agruparAcompanhamento(lista){
  const grupos = {}, ordem = [];
  lista.forEach(x => {
    const k = norm(x.colaborador) + '|' + (x.unidadeId||'');
    if(!grupos[k]){ grupos[k] = { colaborador:x.colaborador, unidadeId:x.unidadeId, itens:[] }; ordem.push(k); }
    grupos[k].itens.push(x);
  });
  return ordem.map(k => grupos[k]);
}
const corOrigem = o => o==='ASO'?'bg-red-50 text-danger':(o==='Laudo'?'bg-stone-100 text-stone-600':'bg-blue-50 text-blue-600');

/* ═══════════════════════════ 3. LAUDOS SST ═══════════════════════════ */
/* Um registro por unidade. Cada entrega vira uma versão; as anteriores vão
   para o histórico. A contagem de dias olha apenas a versão vigente.        */

const DOC_TIPOS = [
  'PCMSO', 'PGR', 'LTCAT', 'AET', 'PCA', 'PPR',
  'Laudo de Insalubridade', 'Laudo de Periculosidade', 'Ordem de Serviço', 'Relatório Analítico'
];
const DOC_DESCR = {
  'PCMSO':'Programa de Controle Médico de Saúde Ocupacional',
  'PGR':'Programa de Gerenciamento de Riscos',
  'LTCAT':'Laudo Técnico das Condições Ambientais do Trabalho',
  'AET':'Análise Ergonômica do Trabalho',
  'PCA':'Programa de Conservação Auditiva',
  'PPR':'Programa de Proteção Respiratória'
};
function parseDocs(s){
  if(Array.isArray(s)) return s.slice();
  return String(s||'').split(/[+;,\/]/).map(x => x.trim()).filter(Boolean)
    .map(x => DOC_TIPOS.find(t => norm(t) === norm(x)) || x);
}
function docsLabel(a){ return (parseDocs(a)).join(' + ') || '—'; }

/* migra o formato antigo (uma linha por entrega) para o novo (histórico por unidade) */
function migrarLaudos(d){
  if(d.laudosVersao === 2) return;
  const grupos = {};
  (d.laudos||[]).forEach(l => {
    const k = l.unidadeId || ('_' + norm(l.localRaw));
    (grupos[k] = grupos[k] || []).push(l);
  });
  d.laudos = Object.keys(grupos).map(k => {
    const itens = grupos[k].slice().sort((a,b) => (a.emissao||'').localeCompare(b.emissao||''));
    const versoes = itens.map(l => ({
      documentos: parseDocs(l.documentos), clinica: l.clinica || '',
      emissao: l.emissao || '', vencimento: l.vencimento || '',
      faturado: !!l.faturado, pagamento: l.pagamento || 'Pendente', valor: Number(l.valor) || 0
    }));
    const atual = versoes.pop() || null;
    const base = itens[itens.length - 1];
    return {
      id: base.id, unidadeId: base.unidadeId, localRaw: base.localRaw || '',
      email: itens.map(x => x.email).filter(Boolean)[0] || '',
      atual, renovacao: null, historico: versoes.reverse()
    };
  });
  d.laudosVersao = 2;
  dedupeLaudos(d);
}

/* Remove versões duplicadas dentro de cada laudo — mesma composição de documentos
   e mesmo mês de vencimento contam como uma só (vieram das duas abas da planilha).
   Mantém a de emissão mais recente como vigente. */
function dedupeLaudos(d){
  if(d.laudosDedupe === 1) return;
  const chave = v => parseDocs(v.documentos).map(norm).sort().join('+') + '|' + (v.vencimento||'').slice(0,7);
  (d.laudos||[]).forEach(l => {
    const todas = [l.atual].concat(l.historico||[]).filter(Boolean);
    const porChave = {};
    todas.forEach(v => {
      const k = chave(v);
      if(!porChave[k] || (v.emissao||'') > (porChave[k].emissao||'')) porChave[k] = v;
    });
    const unicas = Object.values(porChave).sort((a,b) => (b.emissao||'').localeCompare(a.emissao||''));
    l.atual = unicas[0] || null;
    l.historico = unicas.slice(1);
  });
  d.laudosDedupe = 1;
}

/* o status do laudo virou Solicitado/Entregue e o mês de faturamento passou a ser
   uma data própria — antes ele era deduzido da data de entrega */
function migrarLaudoStatus(d){
  if(d.laudoStatusVersao === 1) return;
  (d.laudos||[]).forEach(l => {
    [l.atual].concat(l.historico||[]).filter(Boolean).forEach(v => {
      v.pagamento = (v.pagamento === 'Pago' || v.faturado) ? 'Entregue' : 'Solicitado';
      if(v.pagamento === 'Entregue' && !v.dataFaturamento) v.dataFaturamento = v.emissao || '';
      delete v.faturado;
    });
  });
  d.laudoStatusVersao = 1;
}

/* situação exibida: em elaboração tem prioridade sobre o semáforo de validade */
function laudoSituacao(l){
  const base = l.atual ? semaforo(l.atual.vencimento)
                       : { key:'sem', label:'Sem laudo', dias:null, cls:'bg-slate-100 text-slate-600' };
  if(l.renovacao){
    return { key:'elaboracao', label:'Em elaboração', cls:'bg-blue-100 text-blue-700',
             dias: base.dias, base, desde: l.renovacao.solicitadoEm };
  }
  return Object.assign({ base }, base);
}
function diasDesde(iso){ const d = diasPara(iso); return d === null ? null : -d; }

const UILaudo = { q:'', uni:'', sem:'', page:1 };

function laudosFiltrados(){
  const q = norm(UILaudo.q);
  return DB.laudos.filter(l => {
    const s = laudoSituacao(l);
    const docs = (l.atual ? l.atual.documentos : []).concat(l.renovacao ? l.renovacao.documentos : []);
    return (!UILaudo.uni || l.unidadeId === UILaudo.uni) &&
           (!UILaudo.sem || s.key === UILaudo.sem) &&
           (!q || norm(uniNome(l.unidadeId) + docs.join(' ') + (l.atual&&l.atual.clinica||'') + l.localRaw).includes(q));
  }).sort((a,b) => {
    const sa = laudoSituacao(a), sb = laudoSituacao(b);
    return (sa.dias === null ? 9e9 : sa.dias) - (sb.dias === null ? 9e9 : sb.dias);
  });
}

const LAUDO_STATUS = ['Solicitado','Entregue'];
const campoDocs = (req) => ({ name:'documentos', label:'Tipos de documento', type:'multi', req:!!req, col:'sm:col-span-2',
  options: DOC_TIPOS.map(t => ({ v:t, l: DOC_DESCR[t] ? t + ' — ' + DOC_DESCR[t] : t })),

/* cadastro da unidade + versão vigente */
function editarLaudo(id){
  const l = id ? DB.laudos.find(x => x.id === id) : null;
  const a = (l && l.atual) || {};
  openForm({
    title: l ? 'Editar laudo — ' + uniNome(l.unidadeId) : 'Nova unidade no controle de laudos',
    fields: [
      { name:'unidadeId', label:'Unidade / empresa', type:'select', options:opcoesUnidades().map(o=>({v:o.v,l:o.l})), req:true },
      { name:'clinica', label:'Clínica responsável' },
      campoDocs(false),
      { name:'emissao', label:'Data de entrega', type:'date', hint:'em branco = ainda não entregue' },
      { name:'vencimento', label:'Data de vencimento', type:'date', hint:'calculada: 1 ano após a entrega' },
      { name:'email', label:'E-mail da clínica', type:'email', col:'sm:col-span-2' },
      { name:'pagamento', label:'Status', type:'select', options:LAUDO_STATUS.map(s=>({v:s,l:s})) },
      { name:'dataFaturamento', label:'Data do faturamento', type:'date',
        hint:'o mês/ano desta data define em qual fechamento o laudo entra' }
    ],
    values: Object.assign({ pagamento:'Solicitado', documentos:['PCMSO','PGR','LTCAT'] }, a,
      { unidadeId: l ? l.unidadeId : '', email: l ? l.email : '' }),
    afterRender: ligarCamposLaudo,
    onSave: v => {
      if(!l && DB.laudos.some(x => x.unidadeId === v.unidadeId)){
        toast('Esta unidade já tem controle de laudo. Use "Solicitar renovação".', 'erro'); return;
      }
      const versao = { documentos:v.documentos, clinica:v.clinica, emissao:v.emissao,
                       vencimento: v.emissao ? addDays(v.emissao, 365) : v.vencimento,
                       pagamento:v.pagamento, valor: Number(a.valor)||0,
                       dataFaturamento: v.pagamento === 'Entregue' ? v.dataFaturamento : '' };
      if(l){ l.unidadeId = v.unidadeId; l.email = v.email; l.atual = versao; }
      else DB.laudos.push({ id: uid('ld'), unidadeId:v.unidadeId, localRaw:'', email:v.email,
                            atual: versao, renovacao:null, historico:[] });
      save(); closeModal(); viewLaudos(); toast('Laudo salvo.');
    }
  });
}
/* vencimento sai sozinho da entrega; a data de faturamento só vale se estiver Entregue */
function ligarCamposLaudo(form){
  const emissao = form.elements['emissao'], venc = form.elements['vencimento'];
  const status = form.elements['pagamento'], fat = form.elements['dataFaturamento'];
  const caixaFat = fat.closest('div');
  const sincronizar = () => {
    if(emissao.value) venc.value = addDays(emissao.value, 365);
    const entregue = status.value === 'Entregue';
    caixaFat.style.display = entregue ? '' : 'none';
    if(entregue && !fat.value) fat.value = emissao.value || isoToday();
  };
  emissao.addEventListener('change', sincronizar);
  status.addEventListener('change', sincronizar);
  venc.readOnly = true;
  venc.classList.add('bg-slate-50', 'text-slate-500');
  sincronizar();
}

/* passo 1 — abre a renovação (fica "Em elaboração") */
function solicitarRenovacao(id){
  const l = DB.laudos.find(x => x.id === id); if(!l) return;
  const a = l.atual || {};
  const u = uni(l.unidadeId);
  openForm({

    fields: [

      l.renovacao = v;
      save(); closeModal(); viewLaudos();
      toast('Renovação aberta. O laudo fica "Em elaboração" até a entrega.');

}

/* passo 2 — a clínica entregou: vira a versão vigente e a anterior vai para o histórico */
function concluirRenovacao(id){
  const l = DB.laudos.find(x => x.id === id); if(!l || !l.renovacao) return;
  const r = l.renovacao;
  openForm({
    title: 'Registrar entrega — ' + uniNome(l.unidadeId),
    fields: [
      { name:'emissao', label:'Data de entrega', type:'date', req:true },
      { name:'vencimento', label:'Data de vencimento', type:'date', hint:'calculada: 1 ano após a entrega' },
      { name:'clinica', label:'Clínica responsável' },

/* laudos que caem num mês de faturamento — a data do faturamento é quem manda,
   não a data de entrega: um laudo entregue em junho pode ser faturado em julho */
function entregasLaudos(mes, unidadeId){
  const out = [];
  DB.laudos.forEach(l => {
    if(unidadeId && l.unidadeId !== unidadeId) return;

/* ═══════════════ CARGOS × MATRIZ DE EXAMES ═══════════════
   As planilhas trazem a mesma função escrita de várias formas (COPEIRA,
   COPEIRO, Copeira...). Em vez de reescrever o cadastro — que é dado de RH —
   o valor gravado é preservado e os sinônimos servem só para localizar a
   matriz de exames correspondente. A tela sempre mostra qual matriz foi usada. */
/* variações de escrita → cargo canônico do catálogo.
   Auxiliar de cozinha e as vagas PCD ficam de fora: têm cargo próprio. */
const SINONIMOS = {
  'Copeiro(a)':        ['Copeira','Copeiro','Copeira(o)'],
  'Zelador(a)':        ['Zelador','Zeladora'],
  'Cozinheiro(a)':     ['Cozinheira','Cozinheiro'],
  'Auxiliar de limpeza':['Aux. de limpeza','Auxiliar de Limpeza/Banheirista',
                         'Aprendiz auxiliar limpeza','Aux de limpeza'],
  'Líder de operações':['Lider de Operação','Lider Operacional','Lider Opreracional','Lider Operacional Copa',
                        'Líder de Operação','Lider de Operacao','Lider de Operações','Líder de Operações'],
  'Supervisor(a) administrativo':['Supervisor Adm','Supervisora ADM','Superviso ADM','Lider de ADM','Supervisor administrativo'],
  /* "Supervisor" sem complemento é o da copa */
  'Supervisor(a) de copa':['Supervisora COPA','Supervisor','Supervisora','Supervisoria','Supervisor (Copa)'],
  'Supervisor(a) de RH':['Supervisora RH','Técnica de RH','Tecnica de RH','Líder de RH','Lider de RH','Supervisor RH'],
  'Gerente de RH':     ['Gerente de RH','Gerente RH'],
  'Gerente administrativo':['Gerente'],
  'Gerente geral':     ['Diretor de Conformidade','Gerente Geral'],
  'Gerente comercial': ['Gerente Comercial'],
  'Gerente jurídico':  ['Gerente Juridico'],
  'Assistente administrativo':['Assistente ADM','Auxiliar Administrativo','Asssitente Administrativo',
                        'Auxiliar ADM','Aux. ADM','Assistente de Governança'],
  'Recepcionista':     ['Aprendiz de Recepção'],
  'Recepcionista bilíngue':['Recepcionista Bilingue','Recepcionista bilíngüe'],
  'Analista de compras':['Cood. Projetos','Coordenadora de Projetos','Coordenador de Projetos','Analista de Compras'],
  'Advogado(a)':       ['Advogado'],
  'Auxiliar administrativo (PCD)':['Auxiliar ADM - PCD'],
  'Estoquista (aprendiz)':['estoquista - aprendiz'],
  'Auxiliar de escritório (aprendiz)':['Estagiária','Estagiario','Estagiaria Nutrição','Tec. em Nutrição','Técnica de Nutrição']
};
let _sinIdx = null;
function sinonimoIdx(){
  if(_sinIdx) return _sinIdx;
  _sinIdx = {};
  Object.keys(SINONIMOS).forEach(canon => {
    SINONIMOS[canon].forEach(v => { _sinIdx[norm(v)] = canon; });
  });
  return _sinIdx;
}
/* devolve { matriz, via } — via indica se foi match direto ou por sinônimo */
function matrizDaFuncao(funcao){
  if(!funcao) return { matriz:null, via:'' };
  const n = norm(funcao);
  let m = DB.matriz.find(x => norm(x.funcao) === n);
  if(m) return { matriz:m, via:'' };
  const canon = sinonimoIdx()[n];
  if(canon){
    m = DB.matriz.find(x => norm(x.funcao) === norm(canon));
    if(m) return { matriz:m, via:canon };
  }
  return { matriz:null, via:'' };
}
function examesDaFuncao(funcao, tipo){
  const { matriz } = matrizDaFuncao(funcao);
  if(!matriz) return [];
  return (matriz[tipo] || []).slice();
}
/* separa o que é exame clínico do que é laboratorial/complementar */
function separaExames(lista){
  const clinicos = [], labs = [];
  (lista||[]).forEach(x => (norm(x).includes('EXAMECLINICO') ? clinicos : labs).push(x));
  return { clinicos, labs };
}

/* ═══════════════ CATÁLOGO DE EXAMES ═══════════════ */
const GRUPOS_EXAME = { CLINICO:'Clínico', LABORATORIAL:'Laboratorial', COMPLEMENTAR:'Complementar' };
const SEXOS = { '':'Ambos', 'F':'Apenas feminino', 'M':'Apenas masculino' };   /* restrição do exame */
const SEXO_PESSOA = { '':'não informado', 'F':'Feminino', 'M':'Masculino' };  /* cadastro do colaborador */

/* exames ocupacionais usuais, acrescentados sem colidir com os que já vêm das planilhas */
const EXAMES_PADRAO = [
  { nome:'Acuidade visual',                      grupo:'COMPLEMENTAR' },
  { nome:'Audiometria tonal',                    grupo:'COMPLEMENTAR' },
  { nome:'Espirometria',                         grupo:'COMPLEMENTAR' },
  { nome:'Eletrocardiograma (ECG)',              grupo:'COMPLEMENTAR' },
  { nome:'Eletroencefalograma (EEG)',            grupo:'COMPLEMENTAR' },
  { nome:'Raio-X de tórax',                      grupo:'COMPLEMENTAR' },
  { nome:'Raio-X de coluna lombar',              grupo:'COMPLEMENTAR' },
  { nome:'Avaliação psicossocial',               grupo:'COMPLEMENTAR' },
  { nome:'Glicemia de jejum',                    grupo:'LABORATORIAL' },
  { nome:'Creatinina',                           grupo:'LABORATORIAL' },
  { nome:'Gama GT',                              grupo:'LABORATORIAL' },
  { nome:'Colesterol total e triglicerídeos',    grupo:'LABORATORIAL' },
  { nome:'EAS / Urina tipo I',                   grupo:'LABORATORIAL' },
  { nome:'VDRL',                                 grupo:'LABORATORIAL' },
  { nome:'Colinesterase plasmática e eritrocitária', grupo:'LABORATORIAL' },
  { nome:'Cultura de fezes (salmonela, shigella e E. coli)', grupo:'LABORATORIAL' }
];

function grupoProvavel(nome){
  const n = norm(nome);
  if(n.includes('EXAMECLINICO') || n.includes('CLINICO')) return 'CLINICO';
  if(n.includes('RAIOX') || n.includes('AUDIOMETRIA') || n.includes('ACUIDADE') ||
     n.includes('ESPIROMETRIA') || n.includes('ELETRO')) return 'COMPLEMENTAR';
  return 'LABORATORIAL';
}
/* monta o catálogo preservando exatamente os nomes que já existem na matriz */
function migrarExames(d){
  if(d.examesVersao === 3) return;
  d.exames = d.exames || [];
  const idx = {};
  d.exames.forEach(e => { idx[norm(e.nome)] = e; });
  const inclui = (nome, grupo, sexo) => {
    const n = norm(nome);
    if(!n || idx[n]) return;
    const e = { id: uid('ex'), nome, grupo: grupo || grupoProvavel(nome), sexo: sexo || '' };
    idx[n] = e; d.exames.push(e);
  };
  ['ADMISSIONAL','PERIODICO','TROCA_FUNCAO','RETORNO','DEMISSIONAL'].forEach(t => {
    (d.matriz||[]).forEach(m => (m[t]||[]).forEach(x => inclui(x)));
  });
  EXAMES_PADRAO.forEach(e => inclui(e.nome, e.grupo));
  EXAMES_CARTEIRINHA.forEach(nome => inclui(nome));   /* exigidos pela carteirinha sanitária */
  /* o teste de gravidez só se aplica ao sexo feminino */
  d.exames.forEach(e => { if(norm(e.nome).includes('TESTEDEGRAVIDEZ')) e.sexo = 'F'; });
  if(!d.exames.some(e => norm(e.nome).includes('TESTEDEGRAVIDEZ')))
    inclui('Teste de gravidez', 'LABORATORIAL', 'F');
  d.examesVersao = 3;
}

/* custo Arys → Atlas (preço que a clínica cobra por cada exame) */
const CUSTO_ARYS = [
  { match:'EXAMECLINICO',   custo:61 },   // Avaliação clínica ocupacional
  { match:'AVALIACAOCLINICA', custo:61 },
  { match:'COPROCULTURA',   custo:25 },   // Cultura nas fezes
  { match:'CULTURADEFEZES', custo:25 },
  { match:'HEMOGRAMA',      custo:25 },
  { match:'PARASITOLOGICO', custo:25 },
  { match:'TESTEDEGRAVIDEZ', custo:35 },  // Beta HCG
  { match:'BETAHCG',        custo:35 }
];
function migrarPrecos(d){
  d.visitas = d.visitas || [];
  d.precosUnidade = d.precosUnidade || {};   /* overrides por unidade: {unidadeId:{asoLab,asoClinico,laudo,visita}} */
  /* custo Arys nos exames do catálogo (só preenche o que ainda está sem custo) */
  (d.exames||[]).forEach(e => {
    if(e.custo == null){
      const n = norm(e.nome);
      const hit = CUSTO_ARYS.find(c => n.includes(c.match));
      e.custo = hit ? hit.custo : 0;
    }
  });
  if(d.precosVersao !== 2){
    /* preços padrão que a Atlas cobra das unidades:
       ASO com exames laboratoriais = R$150 · ASO só clínico = R$80 */
    const antigoAso = d.precos && d.precos.aso;
    d.precos = Object.assign(
      { asoLab:150, asoClinico:80, laudo:1400, visita:400 },
      d.precos ? { laudo:d.precos.laudo, visita:d.precos.visita } : {}
    );
    /* re-aplica o valor por exame realizado: 150 se tem laboratorial, 80 se só clínico.
       Corrige os que estavam vazios ou no antigo padrão fixo (100) sem tocar em ajustes manuais. */
    (d.emissoes||[]).forEach(e => {
      if(e.status !== 'REALIZADO') return;
      const v = Number(e.valor);
      if(!v || v === antigoAso || v === 100){
        e.valor = (e.exameLab||'').trim() ? d.precos.asoLab : d.precos.asoClinico;
      }
    });
    d.precosVersao = 2;
  }
  /* valor mensal (mensalidade da unidade) — padrão global 0 */
  if(d.precos.mensal == null) d.precos.mensal = 0;
  /* Qualy Food começa com mensalidade de R$250 (uma vez só) */
  if(!d.mensalSeed){
    d.precosUnidade['QFOOD'] = d.precosUnidade['QFOOD'] || {};
    if(d.precosUnidade['QFOOD'].mensal == null) d.precosUnidade['QFOOD'].mensal = 250;
    d.mensalSeed = 1;
  }
  /* visitas técnicas ganham fluxo (Solicitado→Agendado→Realizado); as antigas já eram realizadas */
  if(!d.visitasFluxo){
    d.visitas.forEach(v => {
      if(!v.status) v.status = 'REALIZADO';
      if(!v.mes) v.mes = (v.data||'').slice(0,7);
    });
    d.visitasFluxo = 1;
  }
  /* mês de faturamento da visita (separado da data da visita) */
  d.visitas.forEach(v => { if(v.fechamento == null) v.fechamento = v.mes || (v.data||'').slice(0,7); });
  /* reajuste de preços: laudo 1400→2200, visita 400→600 */
  if(d.precosVersao !== 3){
    if(Number(d.precos.laudo) === 1400) d.precos.laudo = 2200;
    if(Number(d.precos.visita) === 400) d.precos.visita = 600;
    /* atualiza laudos e visitas que estavam no valor antigo (não toca em ajustes fora do padrão) */
    (d.laudos||[]).forEach(l => {
      [l.atual].concat(l.historico||[]).filter(Boolean).forEach(w => { if(Number(w.valor) === 1400) w.valor = 2200; });
      if(l.renovacao && Number(l.renovacao.valor) === 1400) l.renovacao.valor = 2200;
    });
    (d.visitas||[]).forEach(v => { if(Number(v.valor) === 400) v.valor = 600; });
    d.precosVersao = 3;
  }
  /* carteirinha sanitária: R$25 cobrados da unidade, R$16 pagos à Arys */
  if(d.precos.carteirinha == null) d.precos.carteirinha = 25;
  if(d.precos.carteirinhaCusto == null) d.precos.carteirinhaCusto = 16;
  (d.emissoes||[]).forEach(e => { if(e.carteirinha === undefined) e.carteirinha = false; });
  /* a exigência é por FUNÇÃO dentro da unidade — recepção, por exemplo, não precisa. */
  (d.cargos||[]).forEach(c => { if(c.carteirinha === undefined) c.carteirinha = false; });
  if(d.carteirinhaSeed !== 3){
    (d.unidades||[]).forEach(u => {
      if(!Array.isArray(u.carteirinhaFuncoes)) u.carteirinhaFuncoes = [];
      delete u.carteirinha;                                  /* modelo antigo: todos da unidade */
    });

    /* resolve a função escrita no cadastro para o cargo canônico do catálogo.
       O sinônimo vem primeiro: o catálogo também tem variações importadas
       ("ZELADOR", "SUPERVISOR") que precisam convergir para o nome oficial. */
    const cargoDe = funcao => {
      if(!funcao) return '';
      const n = norm(funcao);
      const canon = sinonimoIdx()[n];
      if(canon){
        const c = (d.cargos||[]).find(x => norm(x.funcao) === norm(canon));
        if(c) return c.funcao;
      }
      const oficial = (d.cargos||[]).find(c => norm(c.funcao) === n && !c.importado);
      if(oficial) return oficial.funcao;
      const qualquer = (d.cargos||[]).find(c => norm(c.funcao) === n);
      return qualquer ? qualquer.funcao : '';
    };

    /* semeia cada unidade com as funções que de fato emitiram carteirinha na planilha.
       Recepção fica de fora: não é função que exige carteirinha. */
    const porUni = {};
    (d.emissoes||[]).forEach(e => {
      if(!e.carteirinha || !e.unidadeId) return;
      const c = (d.colaboradores||[]).find(x => norm(x.nome) === norm(e.colaborador));
      const cargo = cargoDe(c && c.funcao);
      if(!cargo || norm(cargo).includes('RECEPCION')) return;
      (porUni[e.unidadeId] = porUni[e.unidadeId] || new Set()).add(cargo);
    });
    Object.keys(porUni).forEach(uid2 => {
      const u = (d.unidades||[]).find(x => x.id === uid2); if(!u) return;
      const atual = new Set((u.carteirinhaFuncoes||[]).map(norm));
      porUni[uid2].forEach(f => { if(!atual.has(norm(f))){ atual.add(norm(f)); u.carteirinhaFuncoes.push(f); } });
    });
    /* mantém só funções que existem no catálogo, sem repetição */
    (d.unidades||[]).forEach(u => {
      const vistos = new Set();
      u.carteirinhaFuncoes = (u.carteirinhaFuncoes||[]).map(cargoDe).filter(f => {
        if(!f || vistos.has(norm(f))) return false;
        vistos.add(norm(f)); return true;
      });
    });

    /* revisa TODAS as emissões: quem exige passa a ter carteirinha; demissional nunca tem */
    const exigeNaBase = e => {
      if(TIPOS_SEM_CARTEIRINHA.includes(e.tipoExame||'')) return false;
      const c = (d.colaboradores||[]).find(x => norm(x.nome) === norm(e.colaborador));
      const cargo = cargoDe(c && c.funcao);
      if(!cargo) return false;
      const u = (d.unidades||[]).find(x => x.id === e.unidadeId);
      const porUnidade = !!(u && (u.carteirinhaFuncoes||[]).some(f => norm(f) === norm(cargo)));
      const porCargo = (d.cargos||[]).some(x => x.carteirinha && norm(x.funcao) === norm(cargo));
      return porUnidade || porCargo;
    };
    (d.emissoes||[]).forEach(e => { e.carteirinha = exigeNaBase(e); });
    d.carteirinhaSeed = 3;
  }
}

/* ─── carteirinha sanitária ───
   Exigida quando a FUNÇÃO está marcada na unidade, ou quando o cargo exige
   em qualquer unidade. Demissional nunca gera carteirinha. */
const TIPOS_SEM_CARTEIRINHA = ['DEMISSIONAL'];
function tipoAceitaCarteirinha(tipo){ return !TIPOS_SEM_CARTEIRINHA.includes(tipo || ''); }

/* exames laboratoriais obrigatórios para emitir a carteirinha sanitária */
const EXAMES_CARTEIRINHA = [
  'Exame Parasitológico de Fezes (EPF)',
  'Hemograma Completo com Contagem de Plaquetas',
  'COPROCULTURA'
];
/* lista aplicável a este colaborador/tipo — vazia quando a carteirinha não é exigida */
function examesCarteirinha(unidadeId, funcao, tipo){
  if(tipo !== undefined && !tipoAceitaCarteirinha(tipo)) return [];
  return exigeCarteirinha(unidadeId, funcao).exige ? EXAMES_CARTEIRINHA.slice() : [];
}

/* devolve o nome do cargo do catálogo equivalente à função escrita no cadastro
   ("ZELADORA", "Zelador" → "Zelador(a)"). O sinônimo vem primeiro: o catálogo
   também guarda variações importadas do cadastro, e queremos sempre o canônico. */
function funcaoCanonica(funcao){
  if(!funcao) return '';
  const n = norm(funcao);
  const canon = sinonimoIdx()[n];
  if(canon){
    const c = (DB.cargos||[]).find(x => norm(x.funcao) === norm(canon));
    if(c) return c.funcao;
  }
  const oficial = (DB.cargos||[]).find(c => norm(c.funcao) === n && !c.importado);
  if(oficial) return oficial.funcao;
  const qualquer = (DB.cargos||[]).find(c => norm(c.funcao) === n);
  return qualquer ? qualquer.funcao : funcao;
}
function unidadeExigeCarteirinha(unidadeId, funcao){
  const u = uni(unidadeId);
  if(!u || !funcao) return false;
  const alvo = norm(funcaoCanonica(funcao));
  return (u.carteirinhaFuncoes||[]).some(f => norm(funcaoCanonica(f)) === alvo);
}
function funcaoExigeCarteirinha(funcao){
  if(!funcao) return false;
  const alvo = norm(funcaoCanonica(funcao));
  return (DB.cargos||[]).some(c => c.carteirinha && norm(c.funcao) === alvo);
}
/* motivo textual, para explicar na tela por que é exigida */
function exigeCarteirinha(unidadeId, funcao){
  const porUni = unidadeExigeCarteirinha(unidadeId, funcao);
  const porFun = funcaoExigeCarteirinha(funcao);
  if(!porUni && !porFun) return { exige:false, motivo:'' };
  return { exige:true, motivo: porFun ? 'função ' + funcao + ' (todas as unidades)'
                              : esc(funcao) + ' na ' + ((uni(unidadeId)||{}).sigla || '') };
}
/* a emissão herda a exigência do colaborador cadastrado — respeitando o tipo do exame */
function emissaoExigeCarteirinha(e){
  if(!tipoAceitaCarteirinha(e.tipoExame)) return false;
  const c = DB.colaboradores.find(x => norm(x.nome) === norm(e.colaborador));
  return exigeCarteirinha(e.unidadeId, c ? c.funcao : '').exige;
}
/* carteirinha marcada segue o fluxo do exame: realizado = emitida (ok);
   solicitado/agendado = ainda pendente de emissão */
function carteirinhaPendente(e){
  return !!e.carteirinha && !exameEncerrado(e);
}
function carteirinhaOk(e){
  return !!e.carteirinha && e.status === 'REALIZADO';
}
function precoCarteirinha(unidadeId){
  const o = (DB.precosUnidade||{})[unidadeId] || {};
  return o.carteirinha != null ? o.carteirinha : (DB.precos.carteirinha || 0);
}
function custoCarteirinha(){ return Number(DB.precos.carteirinhaCusto) || 0; }
function custoExame(nome){ const e = exameCatalogo(nome); return e ? Number(e.custo)||0 : 0; }

/* preço cobrado da unidade, respeitando override por unidade */
function temLaboratorial(e){ return !!(e.exameLab||'').trim(); }
function precoAso(unidadeId, comLab){
  const o = (DB.precosUnidade||{})[unidadeId] || {};
  if(comLab) return o.asoLab != null ? o.asoLab : DB.precos.asoLab;
  return o.asoClinico != null ? o.asoClinico : DB.precos.asoClinico;
}
function precoLaudo(unidadeId){ const o=(DB.precosUnidade||{})[unidadeId]||{}; return o.laudo!=null?o.laudo:DB.precos.laudo; }
function precoVisita(unidadeId){ const o=(DB.precosUnidade||{})[unidadeId]||{}; return o.visita!=null?o.visita:DB.precos.visita; }
function precoMensal(unidadeId){ const o=(DB.precosUnidade||{})[unidadeId]||{}; return o.mensal!=null?o.mensal:(DB.precos.mensal||0); }

/* valor efetivamente cobrado, por mês + unidade (unidade vazia = consolidado) */
function chaveCobrado(mes, unidade){ return mes + '|' + (unidade || 'TODAS'); }
function totalCobrado(mes, unidade){ return Number((DB.totaisCobrados||{})[chaveCobrado(mes, unidade)]) || 0; }
function setTotalCobrado(mes, unidade, valor){
  DB.totaisCobrados = DB.totaisCobrados || {};
  const k = chaveCobrado(mes, unidade);
  if(!valor) delete DB.totaisCobrados[k]; else DB.totaisCobrados[k] = Number(valor);
  save();
}

function precoEmissao(e){ return precoAso(e.unidadeId, temLaboratorial(e)); }
/* custo que a Atlas paga à Arys por uma emissão: clínico + exames laboratoriais listados */
function custoEmissao(e){
  if(naoCompareceu(e)) return 0;
  let total = 0;
  const clin = DB.exames.find(x => norm(x.nome).includes('EXAMECLINICO') || norm(x.nome).includes('AVALIACAOCLINICA'));
  if(clin) total += Number(clin.custo)||0;
  (e.exameLab||'').split(/[\/;+]/).map(s => s.trim()).filter(Boolean).forEach(nome => {
    total += custoExame(nome);
  });
  return total;
}
function exameCatalogo(nome){
  const n = norm(nome);
  return (DB.exames || []).find(e => norm(e.nome) === n) || null;
}
function examesOrdenados(){
  const ordem = { CLINICO:0, LABORATORIAL:1, COMPLEMENTAR:2 };
  return (DB.exames||[]).slice().sort((a,b) =>
    (ordem[a.grupo]-ordem[b.grupo]) || a.nome.localeCompare(b.nome,'pt-BR'));
}
function selo(e){
  if(!e || !e.sexo) return '';
  return `<span class="ml-1 text-[10px] px-1 rounded ${e.sexo==='F'?'bg-pink-100 text-pink-700':'bg-sky-100 text-sky-700'}"
    title="${esc(SEXOS[e.sexo])}">${e.sexo==='F'?'♀':'♂'}</span>`;
}

/* aplica a restrição de sexo ao montar os exames de um colaborador */
function examesParaColaborador(c, tipo){
  const daMatriz = examesDaFuncao(c ? c.funcao : '', tipo);
  /* a carteirinha sanitária traz seus próprios exames, além dos da matriz */
  const daCarteirinha = c ? examesCarteirinha(c.unidadeId, c.funcao, tipo) : [];
  const vistos = new Set(daMatriz.map(norm));
  const lista = daMatriz.concat(daCarteirinha.filter(x => !vistos.has(norm(x))));
  const aplicaveis = [], restritos = [];
  lista.forEach(nome => {
    const e = exameCatalogo(nome);
    if(e && e.sexo){
      if(!c || !c.sexo) { restritos.push({ nome, motivo:'sexo não informado no cadastro' }); return; }
      if(c.sexo !== e.sexo){ restritos.push({ nome, motivo: SEXOS[e.sexo].toLowerCase() }); return; }
    }
    aplicaveis.push(nome);
  });
  return { aplicaveis, restritos };
}

/* um ASO por colaborador; os exames anteriores viram histórico */
function migrarAsos(d){
  if(d.asosVersao === 2) return;
  const grupos = {};
  (d.asos||[]).forEach(a => { (grupos[a.colaboradorId] = grupos[a.colaboradorId] || []).push(a); });
  d.asos = Object.keys(grupos).map(cid => {
    const itens = grupos[cid].slice().sort((x,y) => (x.dataExame||'').localeCompare(y.dataExame||''));
    const vigente = itens.pop();
    vigente.historico = itens.reverse().map(x => ({
      tipo:x.tipo, dataExame:x.dataExame, vencimento:x.vencimento, resultado:x.resultado||'',
      medico:x.medico||'', s2220:x.s2220||'', s2240:x.s2240||'', origemEmissaoId:x.origemEmissaoId||''
    }));
    if(vigente.origemEmissaoId === undefined) vigente.origemEmissaoId = '';
    return vigente;
  });
  d.asosVersao = 2;
}

/* mesma pessoa cadastrada duas vezes (mesmo nome + CPF, às vezes só a pontuação do
   CPF muda) — junta num só cadastro, preservando o ASO/histórico dos dois lados,
   e remove o duplicado. As emissões não precisam de ajuste: são casadas por nome. */
function migrarDuplicidadesCadastro(d){
  if(d.dupCadastroVersao === 1) return;
  const soDigitos = s => (s || '').replace(/\D/g, '');
  const grupos = {};
  (d.colaboradores || []).forEach(c => {
    const chave = norm(c.nome) + '|' + soDigitos(c.cpf);
    (grupos[chave] = grupos[chave] || []).push(c);
  });

  const idsRemovidos = new Set();
  Object.keys(grupos).forEach(chave => {
    const lista = grupos[chave];
    if(!chave.split('|')[1] || lista.length < 2) return;   /* precisa de CPF para casar com segurança */
    lista.sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
    const titular = lista[0];
    const idsGrupo = lista.map(c => c.id);

    lista.slice(1).forEach(dup => {
      Object.keys(dup).forEach(k => { if(!titular[k] && dup[k]) titular[k] = dup[k]; });
      idsRemovidos.add(dup.id);
    });

    const asosGrupo = (d.asos || []).filter(a => idsGrupo.includes(a.colaboradorId));
    if(asosGrupo.length){
      const eventos = {};
      asosGrupo.forEach(a => {
        [a].concat(a.historico || []).forEach(ev => {
          if(ev.dataExame) eventos[ev.dataExame] = {
            tipo: ev.tipo, dataExame: ev.dataExame, vencimento: ev.vencimento,
            resultado: ev.resultado || '', medico: ev.medico || '',
            s2220: ev.s2220 || '', s2240: ev.s2240 || '', origemEmissaoId: ev.origemEmissaoId || ''
          };
        });
      });
      const ordenados = Object.values(eventos).sort((x, y) => (x.dataExame || '').localeCompare(y.dataExame || ''));
      const vigente = ordenados.pop();
      d.asos = (d.asos || []).filter(a => !idsGrupo.includes(a.colaboradorId));
      if(vigente){
        d.asos.push(Object.assign(
          { id: uid('as'), colaboradorId: titular.id, unidadeId: titular.unidadeId },
          vigente,
          { historico: ordenados.reverse() }
        ));
      }
    }
  });

  d.colaboradores = (d.colaboradores || []).filter(c => !idsRemovidos.has(c.id));
  d.dupCadastroVersao = 1;
}

/* fechamento passa a ser mês de referência (AAAA-MM); faltas saem do campo de exames */
/* "2026-07" → "2026-06" */
function mesAnterior(m){
  const [a, x] = String(m).split('-').map(Number);
  return x > 1 ? a + '-' + String(x-1).padStart(2,'0') : (a-1) + '-12';
}

function migrarEmissoes(d){
  if(d.emissoesVersao === 5) return;

  /* Bases convertidas na v4 usaram o mês da própria data de fechamento. Como a
     planilha registra o DIA em que o fechamento foi feito (01/07 = competência
     de junho), esses meses ficaram um à frente — recua um mês.
     Fechamento digitado à mão no sistema não é tocado. */
  if(d.emissoesVersao === 4){
    (d.emissoes||[]).forEach(e => {
      if(!/^\d{4}-\d{2}$/.test(e.fechamento||'')) return;
      if(e.origem !== 'Advantage' && e.origem !== 'Qualy') return;
      e.fechamento = mesAnterior(e.fechamento);
    });
    d.emissoesVersao = 5;
    return;
  }

  (d.emissoes||[]).forEach(e => {
    /* data COMPLETA só vem da planilha: é o DIA em que o fechamento foi feito,
       e um fechamento no início do mês refere-se ao mês anterior.
       Regra: mês de (data − 1 dia) → 01/07/2026 fatura junho; 31/05 fatura maio.
       Mês digitado direto no sistema (aaaa-mm) fica exatamente como informado. */
    if(/^\d{4}-\d{2}-\d{2}$/.test(e.fechamento||'')) e.fechamento = addDays(e.fechamento, -1).slice(0,7);
    /* a planilha registrava a falta escrevendo "não compareceu" no campo de exames */
    if(norm(e.exameLab||'').includes('NAOCOMPARECEU')){
      e.comparecimento = 'NAO_VIRA';
      e.exameLab = '';
    }

    /* as etapas Arquivado e Fechamento saíram do fluxo e viraram colunas:
       o que era status passa a ser o marcador da coluna correspondente */
    if(e.status === 'ARQUIVADO'){ e.drive = true; e.status = 'REALIZADO'; }
    if(e.status === 'FECHADO'){
      if(!e.fechamento) e.fechamento = (e.dataClinico || e.dataLab || '').slice(0,7);
      e.status = 'REALIZADO';
    }
    if(FLUXO.indexOf(e.status) < 0) e.status = 'SOLICITADO';
  });
  d.emissoesVersao = 5;
}

/* quem tem exame demissional (realizado ou a realizar) está saindo da empresa:
   fica como Desligado e sai da conta de ASOs vencidos */
function migrarDemissionais(d){
  if(d.demissionalVersao === 1) return;
  const porNome = {};
  (d.colaboradores||[]).forEach(c => { porNome[norm(c.nome)] = c; });
  (d.emissoes||[]).forEach(e => {
    if(e.tipoExame !== 'DEMISSIONAL') return;
    const c = porNome[norm(e.colaborador)];
    if(c && c.status !== 'Desligado') c.status = 'Desligado';
  });
  (d.asos||[]).forEach(a => {
    if(a.tipo !== 'DEMISSIONAL') return;
    const c = (d.colaboradores||[]).find(x => x.id === a.colaboradorId);
    if(c && c.status !== 'Desligado') c.status = 'Desligado';
  });
  d.demissionalVersao = 1;
}

/* traz para a emissão a data de emissão do ASO — coluna "ÚLTIMO EXAME ASO"
   das abas por unidade, que já virou a data do ASO do colaborador.
   A do ASO vigente vai para a emissão realizada mais recente; as do histórico,
   para as anteriores, na ordem. */
function migrarDataAso(d){
  if(d.dataAsoVersao === 2) return;
  /* todas as datas de ASO por nome — junta homônimos e o histórico */
  const datasPorNome = {};
  (d.colaboradores||[]).forEach(c => {
    const a = (d.asos||[]).find(x => x.colaboradorId === c.id);
    if(!a) return;
    const k = norm(c.nome);
    const lista = datasPorNome[k] = datasPorNome[k] || [];
    [a].concat(a.historico||[]).forEach(x => { if(x.dataExame) lista.push(x.dataExame); });
  });
  Object.keys(datasPorNome).forEach(k => {
    datasPorNome[k] = [...new Set(datasPorNome[k])].sort().reverse();
  });

  const emsPorNome = {};
  (d.emissoes||[]).forEach(e => {
    if(e.status !== 'REALIZADO' || e.dataAso) return;
    (emsPorNome[norm(e.colaborador)] = emsPorNome[norm(e.colaborador)] || []).push(e);
  });

  Object.keys(emsPorNome).forEach(k => {
    const datas = (datasPorNome[k] || []).slice();
    if(!datas.length) return;
    /* o ASO sai no dia do exame ou pouco depois — casa cada emissão com a data
       mais próxima a partir dela, para não trocar registros entre homônimos */
    emsPorNome[k]
      .sort((a,b) => (b.dataClinico||'').localeCompare(a.dataClinico||''))
      .forEach(e => {
        const ref = e.dataClinico || '';
        let escolhido = -1, melhor = Infinity;
        datas.forEach((dt, i) => {
          if(dt === null) return;
          const dias = ref ? (parseISO(dt) - parseISO(ref)) / 86400000 : 0;
          const score = dias >= 0 ? dias : Math.abs(dias) + 1000;   /* prefere ASO no dia ou depois */
          if(score < melhor){ melhor = score; escolhido = i; }
        });
        if(escolhido >= 0 && melhor < 1400){
          e.dataAso = datas[escolhido];
          datas[escolhido] = null;                                   /* cada data serve uma emissão */
        }
      });
  });
  d.dataAsoVersao = 2;
}

/* "não irá comparecer" deixou de ser coluna e virou situação no fluxo */
function migrarNaoCompareceu(d){
  if(d.naoCompareceuVersao === 1) return;
  (d.emissoes||[]).forEach(e => {
    if(e.comparecimento){ e.status = 'NAO_COMPARECEU'; e.carteirinha = false; }
    delete e.comparecimento;
  });
  d.naoCompareceuVersao = 1;
}

/* completa o catálogo com as funções que existem no cadastro mas não têm cargo */
/* nomes antigos → padrão único (minúsculo, com flexão de gênero) */
const RENOMEIA_CARGO = {
  'Advogado':'Advogado(a)',
  'Analista de Compras':'Analista de compras',
  'Asssitente Administrativo':'Assistente administrativo',
  'Copeira(o)':'Copeiro(a)',
  'Gerente Comercial':'Gerente comercial',
  'Gerente Geral':'Gerente geral',
  'Gerente Juridico':'Gerente jurídico',
  'Gerente RH':'Gerente de RH',
  'Líder de Operações':'Líder de operações',
  'Recepcionista bilíngüe':'Recepcionista bilíngue',
  'Supervisor (Copa)':'Supervisor(a) de copa',
  'Supervisor administrativo':'Supervisor(a) administrativo',
  'Supervisor RH':'Supervisor(a) de RH'
};
/* vagas PCD: cargo próprio que herda CBO e descrição do equivalente */
const CARGOS_PCD = {
  'Auxiliar de limpeza (PCD)':'Auxiliar de limpeza',
  'Auxiliar administrativo (PCD)':'Assistente administrativo'
};
const PCD_ALIAS = { 'AUXILIARADMPCD':'Auxiliar administrativo (PCD)',
                    'AUXILIARDELIMPEZAPCD':'Auxiliar de limpeza (PCD)' };
/* cargo que a usuária vai detalhar por conta própria — não unificar */
const CARGOS_INTOCAVEIS = ['AUXILIARDECOZINHA'];

function migrarCargos(d){
  /* 1ª carga: traz para o catálogo as funções que só existem no cadastro */
  if(d.cargosVersao !== 2 && d.cargosVersao !== 3){
    const existentes = {};
    d.cargos.forEach(c => { existentes[norm(c.funcao)] = true; });
    const novas = {};
    d.colaboradores.forEach(c => {
      const n = norm(c.funcao);
      if(!n || existentes[n] || novas[n]) return;
      novas[n] = c.funcao;
    });
    Object.keys(novas).forEach(n => {
      d.cargos.push({ id: uid('cg'), cbo:'', funcao: novas[n], descricao:'', importado:true });
    });
    d.cargosVersao = 2;
  }

  if(d.cargosVersao === 3) return;

  /* --- unificação: uma linha por função, mantendo quem tem CBO --- */
  d.cargos.forEach(c => { if(RENOMEIA_CARGO[c.funcao]) c.funcao = RENOMEIA_CARGO[c.funcao]; });
  /* quem aponta para o cargo pelo nome acompanha a renomeação */
  (d.matriz||[]).forEach(m => { if(RENOMEIA_CARGO[m.funcao]) m.funcao = RENOMEIA_CARGO[m.funcao]; });
  (d.unidades||[]).forEach(u => {
    u.carteirinhaFuncoes = (u.carteirinhaFuncoes||[]).map(f => RENOMEIA_CARGO[f] || f);
  });

  const idx = {};                                   /* norm(nome canônico) → cargo */
  d.cargos.forEach(c => { if(!idx[norm(c.funcao)] || c.cbo) idx[norm(c.funcao)] = c; });
  const canonDe = f => {
    const n = norm(f);
    if(PCD_ALIAS[n]) return PCD_ALIAS[n];
    const s = sinonimoIdx()[n];
    return s || null;
  };

  /* vagas PCD viram cargo próprio com os dados do equivalente */
  Object.keys(CARGOS_PCD).forEach(nome => {
    const base = idx[norm(CARGOS_PCD[nome])];
    /* pode existir com outra grafia ("AUXILIAR DE LIMPEZA (PCD)") — padroniza o nome */
    let alvo = d.cargos.find(c => norm(c.funcao) === norm(nome))
            || d.cargos.find(c => PCD_ALIAS[norm(c.funcao)] === nome);
    if(alvo) alvo.funcao = nome;
    else { alvo = { id: uid('cg'), funcao: nome, cbo:'', descricao:'' }; d.cargos.push(alvo); }
    if(base){ if(!alvo.cbo) alvo.cbo = base.cbo || ''; if(!alvo.descricao) alvo.descricao = base.descricao || ''; }
    delete alvo.importado;
    idx[norm(nome)] = alvo;
    /* herda também a matriz de exames do cargo equivalente */
    if(base && !(d.matriz||[]).some(m => norm(m.funcao) === norm(nome))){
      const mBase = (d.matriz||[]).find(m => norm(m.funcao) === norm(base.funcao));
      if(mBase) d.matriz.push(Object.assign({}, JSON.parse(JSON.stringify(mBase)), { id: uid('mx'), funcao: nome }));
    }
  });

  /* remove as variações que já têm canônico — nunca as que têm CBO ou são intocáveis */
  d.cargos = d.cargos.filter(c => {
    const n = norm(c.funcao);
    if(c.cbo) return true;
    if(CARGOS_INTOCAVEIS.includes(n)) return true;
    if(idx[n] && idx[n] !== c) return false;        /* duplicata exata sem CBO */
    const canon = canonDe(c.funcao);
    return !(canon && idx[norm(canon)]);            /* variação de escrita */
  });
  d.cargosVersao = 3;
}
function cargosOrdenados(){
  return DB.cargos.slice().sort((a,b) => a.funcao.localeCompare(b.funcao, 'pt-BR'));
}
/* funções do catálogo sem as variações de escrita importadas do cadastro
   ("ZELADOR" e "Zeladora" somem; fica "Zelador(a)") */
function funcoesCanonicasCadastradas(){
  const vistos = new Set(), out = [];
  cargosOrdenados().forEach(c => {
    const canon = funcaoCanonica(c.funcao);
    if(vistos.has(norm(canon))) return;
    vistos.add(norm(canon)); out.push(canon);
  });
  return out.sort((a,b) => a.localeCompare(b,'pt-BR'));
}

/* bloco reutilizado nos modais: mostra a matriz de exames da função escolhida */
function painelMatriz(funcao, opcoes){
  const o = opcoes || {};
  if(!funcao) return `<div class="bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs text-slate-500">
    Escolha a função para ver os exames obrigatórios.</div>`;
  const { matriz, via } = matrizDaFuncao(funcao);
  /* carteirinha sanitária: depende da unidade e/ou da função, não da matriz */
  const cart = o.unidadeId !== undefined ? exigeCarteirinha(o.unidadeId, funcao) : { exige:false, motivo:'' };
  const cartNoTipo = cart.exige && (o.tipo === undefined || tipoAceitaCarteirinha(o.tipo));
  const avisoCart = cart.exige ? `
    <div class="bg-teal-50 border border-teal-200 rounded-lg p-2.5 text-xs text-teal-800 mt-2">
      <p><i class="fa-solid fa-id-card mr-1"></i><b>Exige carteirinha sanitária</b>
        <span class="text-teal-700">— por ${esc(cart.motivo)} · ${fmtMoney(precoCarteirinha(o.unidadeId))} por emissão</span></p>

        ? `<p class="mt-1 text-teal-700">Exames obrigatórios da carteirinha:

        : `<p class="mt-1 text-teal-700"><i class="fa-solid fa-circle-info mr-1"></i>Demissional não gera carteirinha.</p>`}
