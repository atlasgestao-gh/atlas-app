    </div>` + avisoCart;
  }
  const tipos = o.tipo ? [o.tipo] : ['ADMISSIONAL','PERIODICO','TROCA_FUNCAO','RETORNO','DEMISSIONAL'];
  return `<div class="bg-blue-50 border border-blue-200 rounded-lg p-3">
    <p class="text-xs font-medium text-blue-900 mb-2">
      <i class="fa-solid fa-clipboard-list mr-1"></i>Exames obrigatórios — matriz ${esc(matriz.funcao)}
      ${matriz.cbo?`<span class="font-mono text-[10px] bg-white px-1.5 py-0.5 rounded ml-1">${esc(matriz.cbo)}</span>`:''}
      ${via?`<span class="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded ml-1" title="A função cadastrada é uma variação de escrita">via sinônimo</span>`:''}
    </p>
    <div class="grid ${o.tipo?'grid-cols-1':'grid-cols-1 sm:grid-cols-2'} gap-1.5">
      ${tipos.map(t => {
        const l = matriz[t] || [];
        const partes = l.map(nome => {
          const e = exameCatalogo(nome);
          if(e && e.sexo && o.sexo !== undefined){
            if(!o.sexo) return `<span class="text-slate-400 line-through" title="sexo não informado no cadastro">${esc(nome)}</span>`;
            if(o.sexo !== e.sexo) return `<span class="text-slate-400 line-through" title="${esc(SEXOS[e.sexo])}">${esc(nome)}</span>`;
          }
          return esc(nome) + (e && e.sexo ? selo(e) : '');
        });
        return `<div class="bg-white rounded px-2 py-1.5">
          <p class="text-[11px] font-medium text-slate-700">${TIPOS[t]}</p>
          <p class="text-[11px] text-slate-600">${l.length ? partes.join(' · ') : '<span class="text-slate-300">a cadastrar</span>'}</p>
        </div>`;
      }).join('')}
    </div>
    ${o.sexo !== undefined && !o.sexo && temExameRestrito(matriz, tipos)
      ? `<p class="text-[11px] text-amber-800 bg-amber-50 border border-amber-200 rounded px-2 py-1.5 mt-2">
           <i class="fa-solid fa-triangle-exclamation mr-1"></i>Há exame com restrição de sexo nesta matriz.
           Informe o sexo no cadastro para que ele seja aplicado corretamente.</p>` : ''}
    ${o.acao || ''}
  </div>` + avisoCart;
}
function temExameRestrito(matriz, tipos){
  return (tipos||['ADMISSIONAL','PERIODICO','TROCA_FUNCAO','RETORNO','DEMISSIONAL'])
    .some(t => (matriz[t]||[]).some(n => { const e = exameCatalogo(n); return e && e.sexo; }));
}

function colabsFiltrados(){

  return DB.colaboradores.filter(c => {

    return (!UIColab.emp || (u && u.empresaId === UIColab.emp)) &&
           (!UIColab.uni || c.unidadeId === UIColab.uni) &&
           (!UIColab.status || c.status === UIColab.status) &&
           (!UIColab.sexo || (UIColab.sexo === 'SEM' ? !c.sexo : c.sexo === UIColab.sexo)) &&
           (!q || norm(c.nome + c.cpf + c.funcao + c.email).includes(q));
  })
  /* mais recentes primeiro, pela data do último exame realizado */
  .sort((a,b) => (ultimoExameDe(b)||'').localeCompare(ultimoExameDe(a)||''));

  const a = asoVigente(c.id);
  if(!a) return '';
  return [a].concat(a.historico||[]).map(x => x.dataExame||'').filter(Boolean).sort().pop() || '';

/* ---- importação de colaboradores por planilha (novas unidades) ----

const ImpColab = { wb:null, arquivo:'', aba:'', unidadeId:'' };

/* chamada a partir do cadastro da unidade: a unidade de destino já vem definida */
function importarColabsArquivo(f, unidadeId){

  if(typeof XLSX === 'undefined'){ toast('Biblioteca de planilhas indisponível — verifique a internet.', 'erro'); return; }
  const r = new FileReader();
  r.onload = ev => {
    try{
      ImpColab.wb = XLSX.read(new Uint8Array(ev.target.result), { type:'array', cellDates:true });
      ImpColab.arquivo = f.name;
      ImpColab.aba = ImpColab.wb.SheetNames[0];
      ImpColab.unidadeId = unidadeId || '';
      openInfo('Importar colaboradores — ' + esc(f.name), `
        <div class="space-y-4">
          <div class="grid sm:grid-cols-2 gap-3">
            <div><label class="block text-xs font-medium text-slate-600 mb-1">Aba da planilha</label>
              <select id="impAba" onchange="ImpColab.aba=this.value;previaImpColabs()"
                class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">
                ${ImpColab.wb.SheetNames.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('')}
              </select></div>
            <div><label class="block text-xs font-medium text-slate-600 mb-1">Unidade de destino</label>
              <select id="impUni" onchange="ImpColab.unidadeId=this.value;previaImpColabs()"
                class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">
                <option value="">— selecione a unidade —</option>
                ${opcoesUnidades().map(o => `<option value="${esc(o.v)}" ${o.v===ImpColab.unidadeId?'selected':''}>${esc(o.l)}</option>`).join('')}
              </select>
              <p class="text-[11px] text-slate-400 mt-1">Cadastre a unidade antes em "Clientes e locais", se ainda não existir.</p></div>
          </div>
          <div id="impPrevia"></div>
        </div>`, 'max-w-2xl');
      previaImpColabs();
    }catch(err){ toast('Não consegui ler a planilha: ' + err.message, 'erro'); }
  };
  r.readAsArrayBuffer(f);
}

/* lê a aba escolhida e devolve linhas mapeadas + estatísticas (sem gravar nada) */
function analisarImpColabs(){
  const linhas = XLSX.utils.sheet_to_json(ImpColab.wb.Sheets[ImpColab.aba], { header:1, defval:'' });
  /* cabeçalho pode não estar na 1ª linha (título decorativo acima) */
  let h = -1;
  for(let i = 0; i < Math.min(linhas.length, 8); i++){
    if(linhas[i].some(c => norm(String(c)) === 'NOME')){ h = i; break; }
  }
  if(h < 0) return { erro:'Não encontrei a coluna NOME nas primeiras linhas desta aba.' };

  const idx = {};
  linhas[h].forEach((c, i) => {
    const n = norm(String(c)); if(!n) return;
    const põe = k => { if(idx[k] === undefined) idx[k] = i; };
    if(n === 'NOME') põe('nome');
    else if(n === 'CPF') põe('cpf');
    else if(n === 'RG') põe('rg');
    else if(n.startsWith('DTNASC') || n.startsWith('DATADENASC') || n === 'NASCIMENTO') põe('nascimento');
    else if(n.startsWith('TELEFONE') || n === 'CELULAR' || n === 'CONTATO') põe('celular');
    else if(n === 'EMAIL') põe('email');
    else if(n === 'FUNCAO' || n === 'CARGO') põe('funcao');
    else if(n === 'SEXO') põe('sexo');
    else if(n.startsWith('ULTIMOEXAME')) põe('ultimoExame');
    else if(n === 'VENCIMENTO') põe('vencimento');
    else if(n === 'ADMISSAO') põe('admissao');
    else if(n === 'AFASTAMENTO') põe('afastamento');
    else if(n === 'STATUS') põe('status');
  });

  const paraISO = v => {
    if(v instanceof Date && !isNaN(v)) return toISO(v);
    const s = String(v||'').trim();
    if(/^\d+(\.\d+)?$/.test(s)){ const n = Number(s);           /* serial do Excel */
      if(n > 20000 && n < 60000) return new Date(Math.round((n - 25569) * 86400000)).toISOString().slice(0,10); }
    const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if(m){ const ano = m[3].length===2 ? '20'+m[3] : m[3];
      return ano+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); }
    return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0,10) : '';
  };
  const cel = (r,k) => idx[k] === undefined ? '' : String(r[idx[k]]==null?'':r[idx[k]]).replace(/\s+/g,' ').trim();
  const normStatus = s => { const n = norm(s);
    if(!n) return 'Ativo';
    if(n.includes('DESLIG') || n.includes('DESILG')) return 'Desligado';
    if(n.includes('INATIV')) return 'Inativo';
    if(n.includes('AFAST')) return 'Afastado';
    return 'Ativo'; };
  const normSexo = s => { const n = norm(s); return n.startsWith('F') ? 'F' : (n.startsWith('M') ? 'M' : ''); };
  const digitos = s => String(s||'').replace(/\D/g,'');

  /* índices dos já cadastrados, para separar novo × atualização */
  const porCpf = {}, porNome = {};
  DB.colaboradores.forEach(c => {
    const d = digitos(c.cpf); if(d.length === 11) porCpf[d] = c;
    porNome[norm(c.nome)] = c;
  });

  const itens = [];
  let vazias = 0;
  for(let i = h+1; i < linhas.length; i++){
    const r = linhas[i];
    const nome = maiusc(cel(r,'nome'));
    if(!nome){ vazias++; continue; }
    const ue = paraISO(idx.ultimoExame !== undefined ? r[idx.ultimoExame] : '');
    let vc = paraISO(idx.vencimento !== undefined ? r[idx.vencimento] : '');
    if(!vc && ue) vc = addDays(ue, 365);
    const cpf = cel(r,'cpf');
    const existente = porCpf[digitos(cpf)] || porNome[norm(nome)] || null;
    itens.push({
      nome, cpf, rg: cel(r,'rg'), nascimento: paraISO(idx.nascimento !== undefined ? r[idx.nascimento] : ''),
      sexo: normSexo(cel(r,'sexo')), celular: cel(r,'celular'), email: cel(r,'email'),
      funcao: cel(r,'funcao'), admissao: paraISO(idx.admissao !== undefined ? r[idx.admissao] : ''),
      afastamento: cel(r,'afastamento'), status: normStatus(cel(r,'status')),
      ultimoExame: ue, vencimento: vc, existente
    });
  }
  const catalogo = {};
  cargosOrdenados().forEach(x => { catalogo[norm(x.funcao)] = true; });
  return {
    itens, vazias,
    colunas: Object.keys(idx),
    novos: itens.filter(x => !x.existente).length,
    atualizados: itens.filter(x => x.existente).length,
    comAso: itens.filter(x => !x.existente && (x.ultimoExame || x.vencimento)).length,
    foraCatalogo: itens.filter(x => x.funcao && !catalogo[norm(x.funcao)]).length
  };
}

        <tr><th class="px-2 py-1.5 text-left">Nome</th><th class="px-2 py-1.5 text-left">Função</th>
            <th class="px-2 py-1.5 text-left">Últ. exame</th><th class="px-2 py-1.5 text-left">Situação</th></tr></thead>

        </tbody></table>

      <button onclick="aplicarImpColabs()" class="px-4 py-2 text-sm rounded-lg bg-accent text-white hover:opacity-90">
        <i class="fa-solid fa-check mr-1"></i>Importar ${a.itens.length} colaborador(es)</button>
    </div>`;
}

async function aplicarImpColabs(){
  if(!ImpColab.unidadeId){ toast('Selecione a unidade de destino.', 'erro'); return; }
  const a = analisarImpColabs();
  if(a.erro || !a.itens.length){ toast('Nada para importar.', 'alerta'); return; }
  await guardarSnapshotLocal('antes de importar colaboradores (' + ImpColab.arquivo + ')');

  let novos = 0, atualizados = 0, asosCriados = 0;
  a.itens.forEach(x => {
    if(x.existente){
      const c = x.existente;
      /* preenche o que veio na planilha sem apagar o que já existe */
      ['cpf','rg','nascimento','sexo','celular','email','funcao','admissao','afastamento'].forEach(k => {
        if(x[k]) c[k] = x[k];
      });
      c.status = x.status;
      c.unidadeId = ImpColab.unidadeId;
      atualizados++;
      if((x.ultimoExame || x.vencimento) && !asoVigente(c.id)){
        DB.asos.push({ id: uid('as'), colaboradorId: c.id, unidadeId: ImpColab.unidadeId, tipo:'',
          dataExame: x.ultimoExame, vencimento: x.vencimento, resultado:'', medico:'', s2220:'', s2240:'' });
        asosCriados++;
      }
    }else{
      const id = uid('cl');
      DB.colaboradores.push({ id, nome:x.nome, cpf:x.cpf, rg:x.rg, nascimento:x.nascimento,
        sexo:x.sexo, celular:x.celular, telefone:'', email:x.email, funcao:x.funcao,
        unidadeId: ImpColab.unidadeId, local:'', admissao:x.admissao,
        afastamento:x.afastamento, status:x.status });

const DIC_SEXO = (() => {
  const m = {};
  NOMES_F.forEach(n => { m[n] = 'F'; });
  NOMES_M.forEach(n => { m[n] = 'M'; });   /* masculino vence em caso de coincidência */

/* terminam em A mas são masculinos */
const MASC_TERMINA_A = ['JONATA','KAUA','NICOLA','LUCA','ELIA','ATILA','ATTILA','SACHA','JOSUA'];

const soLetras = s => norm(s).replace(/[^A-Z]/g,'');
const PARTICULAS = ['DA','DE','DO','DAS','DOS','E','DEL','DI','VAN','VON','JUNIOR','FILHO','NETO'];

/* devolve { sexo:'F'|'M'|'', via:'prenome'|'nome composto'|'terminação' } */
function inferirSexo(nomeCompleto){
  const partes = String(nomeCompleto||'').split(/\s+/).map(soLetras)
    .filter(p => p.length > 1 && !PARTICULAS.includes(p));
  if(!partes.length) return { sexo:'', via:'' };

  if(DIC_SEXO[partes[0]]) return { sexo: DIC_SEXO[partes[0]], via:'prenome' };
  /* prenome desconhecido: procura um nome conhecido no restante (ex.: EILYM ALEXANDRA) */
  for(let i = 1; i < partes.length; i++){
    if(DIC_SEXO[partes[i]]) return { sexo: DIC_SEXO[partes[i]], via:'nome composto' };
  }
  const p = partes[0];
  if(p.endsWith('A') && !MASC_TERMINA_A.includes(p)) return { sexo:'F', via:'terminação' };
  return { sexo:'', via:'' };
}

let _sexoGrupos = null;
function preencherSexoPorNome(){
  const alvos = DB.colaboradores.filter(c => !c.sexo);
  if(!alvos.length){ toast('Todos os colaboradores já têm o sexo definido.'); return; }
  const grupos = {};
  alvos.forEach(c => {
    const chave = soLetras(String(c.nome||'').split(/\s+/)[0]) || '—';
    if(!grupos[chave]) grupos[chave] = { prenome:chave, pessoas:[], sexo:'', via:'' };
    grupos[chave].pessoas.push(c);
  });
  Object.values(grupos).forEach(g => {
    const r = inferirSexo(g.pessoas[0].nome);
    /* prenome desconhecido: tenta o desempate em cada pessoa do grupo */
    if(!r.sexo){
      for(const p of g.pessoas){ const x = inferirSexo(p.nome); if(x.sexo){ g.sexo = x.sexo; g.via = x.via; break; } }
    } else { g.sexo = r.sexo; g.via = r.via; }
  });
  _sexoGrupos = grupos;
  openInfo('Definir sexo pelo nome — ' + alvos.length + ' colaborador(es)',
    '<div id="sexoCorpo"></div>', 'max-w-3xl');
  renderInferenciaSexo();
}

async function aplicarInferenciaSexo(){
  if(!_sexoGrupos) return;
  const gs = Object.values(_sexoGrupos).filter(g => g.sexo);
  const total = gs.reduce((n,g) => n + g.pessoas.length, 0);
  if(!total){ toast('Nenhum sexo definido para aplicar.', 'alerta'); return; }
  await guardarSnapshotLocal('antes de definir sexo pelo nome');
  let n = 0;
  gs.forEach(g => g.pessoas.forEach(p => { if(!p.sexo){ p.sexo = g.sexo; n++; } }));
  _sexoGrupos = null;
  save({ jaJa:true }); closeModal(); viewCadastros();
  toast(n + ' colaborador(es) atualizado(s). Um ponto de retorno ficou em "Backup e segurança".');
}

const UIMatriz = { q:'', pend:'', page:1 };

const TIPOS_MTZ = ['ADMISSIONAL','PERIODICO','TROCA_FUNCAO','RETORNO','DEMISSIONAL'];

/* estado da matriz de um cargo */
function statusMatriz(cargo){
  const r = matrizDaFuncao(cargo.funcao);
  if(!r.matriz) return { ...r, definidos:0, key:'pendente', label:'Pendente', cls:'bg-red-100 text-red-700' };
  const definidos = TIPOS_MTZ.filter(t => (r.matriz[t]||[]).length).length;
  if(definidos === 0) return { ...r, definidos, key:'pendente', label:'Pendente', cls:'bg-red-100 text-red-700' };
  if(definidos < TIPOS_MTZ.length)
    return { ...r, definidos, key:'parcial', label:`Parcial ${definidos}/5`, cls:'bg-amber-100 text-amber-800' };
  return { ...r, definidos, key:'completa', label:'Completa', cls:'bg-emerald-100 text-emerald-700' };
}

/* editar sempre parte de um CARGO; se ele herda a matriz de outro, avisa */
function editarMatriz(cargoId){
  const cargo = DB.cargos.find(c => c.id === cargoId);
  if(!cargo) return;
  const r = matrizDaFuncao(cargo.funcao);
  const propria = r.matriz && !r.via;
  const usam = r.matriz ? DB.cargos.filter(c => {
    const x = matrizDaFuncao(c.funcao);
    return x.matriz && x.matriz.id === r.matriz.id;
  }) : [cargo];
  const pessoas = usam.reduce((s,c) => s + DB.colaboradores.filter(k => norm(k.funcao)===norm(c.funcao)).length, 0);

  const aviso = r.via
    ? `<div class="sm:col-span-2 bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-900">
         <p class="font-medium"><i class="fa-solid fa-circle-info mr-1"></i>Este cargo usa hoje a matriz de <b>${esc(r.matriz.funcao)}</b>.</p>
         <p class="mt-1">Salvando assim, você altera essa matriz — que vale para ${usam.length} cargo(s) e ${pessoas} colaborador(es).
         Marque a opção abaixo se quiser uma matriz exclusiva para <b>${esc(cargo.funcao)}</b>.</p></div>`
    : (r.matriz
        ? `<div class="sm:col-span-2 bg-blue-50 border border-blue-200 rounded-lg p-3 text-xs text-blue-900">
             Esta matriz vale para ${usam.length} cargo(s) e ${pessoas} colaborador(es).</div>`
        : `<div class="sm:col-span-2 bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs text-slate-600">
             Ainda não há exames cadastrados para <b>${esc(cargo.funcao)}</b> —
             ${DB.colaboradores.filter(c => norm(c.funcao)===norm(cargo.funcao)).length} colaborador(es) neste cargo.</div>`);

  const campos = [
    { type:'html', name:'aviso', html:aviso },
    { name:'cbo', label:'CBO' },
    { name:'funcao', label:'Função da matriz', req:true },
    { name:'grade', label:'Exames obrigatórios por tipo de exame', type:'gradeExames',
      hint:'marque na coluna do tipo em que cada exame é exigido · ♀/♂ indicam exames restritos por sexo' },
    { name:'descricao', label:'Descrição das atividades', type:'textarea', rows:2, col:'sm:col-span-2' }
  ];
  if(r.via) campos.splice(1, 0, { name:'exclusiva', label:`Criar matriz exclusiva para "${cargo.funcao}"`, type:'checkbox' });

  openForm({
    title: r.matriz ? 'Matriz de exames — ' + r.matriz.funcao : 'Cadastrar exames — ' + cargo.funcao,
    largura: 'max-w-4xl',
    fields: campos,
    values: {
      cbo: (r.matriz && r.matriz.cbo) || cargo.cbo || '',
      funcao: r.via ? r.matriz.funcao : (r.matriz ? r.matriz.funcao : cargo.funcao),
      descricao: (r.matriz && r.matriz.descricao) || cargo.descricao || '',
      grade: r.matriz || {}
    },
    onSave: v => {
      const dados = { cbo:v.cbo, funcao:v.funcao, descricao:v.descricao };
      TIPOS_MTZ.forEach(t => { dados[t] = v.grade[t] || []; });
      if(r.matriz && !v.exclusiva){
        Object.assign(r.matriz, dados);
      }else{
        dados.funcao = v.exclusiva ? cargo.funcao : dados.funcao;
        DB.matriz.push(Object.assign({ id: uid('mx') }, dados));
      }
      if(!cargo.cbo && v.cbo) cargo.cbo = v.cbo;
      save(); closeModal(); viewCadastros(); toast('Matriz de exames salva.');
    }
  });
}

function exportarMatriz(){
  exportCSV('matriz-pcmso',
    ['Cargo','CBO','Situação','Herda de','Colaboradores','Admissional','Periódico','Troca de função','Retorno','Demissional'],
    cargosOrdenados().map(c => {

      return [c.funcao, c.cbo, st.label, st.via || '',
        DB.colaboradores.filter(k => norm(k.funcao)===norm(c.funcao)).length,
        (m.ADMISSIONAL||[]).join(' / '), (m.PERIODICO||[]).join(' / '),
        (m.TROCA_FUNCAO||[]).join(' / '), (m.RETORNO||[]).join(' / '), (m.DEMISSIONAL||[]).join(' / ')];

}

function editarExameCatalogo(id){
  const e = id ? DB.exames.find(x => x.id === id) : null;
  openForm({
    title: e ? 'Editar exame' : 'Novo exame',
    fields: [
      { name:'nome', label:'Nome do exame', req:true, col:'sm:col-span-2' },
      { name:'grupo', label:'Grupo', type:'select', options:Object.keys(GRUPOS_EXAME).map(k=>({v:k,l:GRUPOS_EXAME[k]})) },
      { name:'custo', label:'Custo (R$)', type:'number', step:'0.01', hint:'quanto a Atlas paga à clínica por este exame' },
      { name:'sexo', label:'Restrição de sexo', type:'select', options:Object.keys(SEXOS).map(k=>({v:k,l:SEXOS[k]})),
        hint:'exames restritos não são sugeridos para quem não se enquadra' }
    ],
    values: e || { grupo:'LABORATORIAL', sexo:'', custo:0 },
    onSave: v => {
      if(e){
        const antigo = e.nome;
        Object.assign(e, v);
        /* renomeou? acompanha nas matrizes para não perder o vínculo */
        if(norm(antigo) !== norm(v.nome)){
          DB.matriz.forEach(m => TIPOS_MTZ.forEach(t => {
            m[t] = (m[t]||[]).map(x => norm(x) === norm(antigo) ? v.nome : x);
          }));
        }
      }else DB.exames.push(Object.assign({ id: uid('ex') }, v));
      save(); closeModal(); viewCadastros(); toast('Exame salvo.');
    }
  });
}
function excluirExameCatalogo(id){
  const e = DB.exames.find(x => x.id === id); if(!e) return;
  const n = DB.matriz.filter(m => TIPOS_MTZ.some(t => (m[t]||[]).some(x => norm(x)===norm(e.nome)))).length;
  if(!confirm(`Excluir "${e.nome}" do catálogo?` + (n ? `\n\nEle está em ${n} matriz(es) e continuará lá, mas sem restrição de sexo nem agrupamento.` : ''))) return;
  DB.exames = DB.exames.filter(x => x.id !== id);
  save(); viewCadastros(); toast('Exame excluído do catálogo.');
}

/* liga colaborador + tipo de exame → matriz do cargo, com botão para aplicar */
function ligarMatrizEmissao(form, preencherAuto, autoUnidade){
  const inpCol = form.elements['colaborador'];
  const selTipo = form.elements['tipoExame'];
  const selUni  = form.elements['unidadeId'];
  const txtLab  = form.elements['exameLab'];
  const alvo    = form.querySelector('#painelMatrizEx');
  let jaPreencheu = false, marcouCart = false;

  const achaColab = () => DB.colaboradores.find(c => norm(c.nome) === norm(inpCol.value));

  /* numa emissão nova, a unidade do cadastro vale sempre — troca sozinha ao escolher o colaborador.
     Numa edição não mexe: a emissão pode ter sido feita numa unidade diferente da atual do cadastro. */
  if(autoUnidade && selUni){
    const preencherUnidade = () => { const c = achaColab(); if(c) selUni.value = c.unidadeId; };
    inpCol.addEventListener('change', preencherUnidade);
    inpCol.addEventListener('input', preencherUnidade);
    preencherUnidade();
  }

  const pintar = () => {
    const c = achaColab();
    if(!c){
      alvo.innerHTML = `<div class="bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs text-slate-500">
        Colaborador não encontrado no cadastro — os exames serão preenchidos manualmente.</div>`;
      return;
    }
    const tipo = selTipo.value;
    const { aplicaveis, restritos } = examesParaColaborador(c, tipo);
    const { clinicos, labs } = separaExames(aplicaveis);
    const acao = aplicaveis.length
      ? `<button type="button" id="btnAplicarMatriz"
           class="mt-2 px-3 py-1.5 rounded-lg text-xs bg-accent text-white hover:bg-blue-700">
           <i class="fa-solid fa-wand-magic-sparkles mr-1"></i>Aplicar aos exames laboratoriais</button>
         ${clinicos.length?`<p class="text-[11px] text-blue-800 mt-1.5">Inclui exame clínico com o médico credenciado.</p>`:''}`
      : '';
    const nota = restritos.length
      ? `<div class="bg-amber-50 border border-amber-200 rounded-lg p-2 mt-2 text-[11px] text-amber-900">
           ${restritos.map(r => `<p><i class="fa-solid fa-ban mr-1"></i><b>${esc(r.nome)}</b> não será incluído — ${esc(r.motivo)}.</p>`).join('')}
           ${restritos.some(r => r.motivo.includes('não informado'))
             ? `<button type="button" onclick="closeModal();editarColab('${c.id}')" class="underline mt-1">Informar o sexo no cadastro</button>` : ''}
         </div>`
      : '';
    alvo.innerHTML =
      `<p class="text-[11px] text-slate-500 mb-1">Cargo no cadastro: <b>${esc(c.funcao||'não informado')}</b>
        · sexo: <b>${esc(SEXO_PESSOA[c.sexo||''])}</b></p>` +
      painelMatriz(c.funcao, { tipo, acao, sexo: c.sexo || '',
        unidadeId: (selUni && selUni.value) || c.unidadeId }) + nota;
    const btn = alvo.querySelector('#btnAplicarMatriz');
    if(btn) btn.addEventListener('click', () => {
      txtLab.value = labs.join(' / ');
      toast(labs.length ? 'Exames da matriz aplicados.' : 'A matriz deste tipo só prevê exame clínico.');
    });
    /* numa emissão nova, já preenche sozinho enquanto o campo estiver vazio */
    if(preencherAuto && !jaPreencheu && !txtLab.value.trim() && labs.length){
      txtLab.value = labs.join(' / ');
      jaPreencheu = true;
    }
    /* mostra o cargo do cadastro; em Troca de Função a escolha aqui substitui o cargo */
    const selFun = form.elements['funcao'];
    if(selFun && !selFun.value && c.funcao){
      const canon = funcaoCanonica(c.funcao);
      if([...selFun.options].some(o => o.value === canon)) selFun.value = canon;
    }
    /* a carteirinha acompanha a função: marca sozinha na 1ª vez, some no demissional */
    const chk = form.elements['carteirinha'];
    if(chk){
      if(!tipoAceitaCarteirinha(tipo)) chk.checked = false;
      else if(!marcouCart && exigeCarteirinha(selUni ? selUni.value : c.unidadeId, c.funcao).exige){
        chk.checked = true; marcouCart = true;
      }
    }
  };
  inpCol.addEventListener('change', pintar);
  inpCol.addEventListener('input', pintar);
  selTipo.addEventListener('change', pintar);
  if(selUni) selUni.addEventListener('change', pintar);   /* a carteirinha depende da unidade */
  pintar();
}

function novaEmissao(pre, opts){
  opts = opts || {};
  openForm({
    title: opts.titulo || 'Nova emissão de exame',
    fields: camposEmissao(),
    values: Object.assign({ status:'SOLICITADO', tipoExame:'PERIODICO', valor:0 }, pre || {}),
    afterRender: form => ligarMatrizEmissao(form, true, true),
    onSave: v => {
      if(v.colaborador) v.colaborador = maiusc(v.colaborador);
      const nova = Object.assign({ id: uid('em'), localRaw:'', origem:'Cadastro manual', arys:'' }, v);
      /* a função do colaborador já define se o atendimento leva carteirinha */
      if(!nova.carteirinha && emissaoExigeCarteirinha(nova)) nova.carteirinha = true;
      if(!tipoAceitaCarteirinha(nova.tipoExame)) nova.carteirinha = false;
      DB.emissoes.push(nova);
      const efeitos = aplicarEfeitosNoCadastro(nova);
      const r = aplicarSyncAso(nova);
      save(); closeModal();
      go(opts.voltarPara || 'exames');
      toast('Emissão registrada.' + (r ? ' ' + r : '') + (efeitos ? ' ' + efeitos + '.' : ''));
    }
  });
}

/* efeitos da emissão sobre o cadastro do colaborador:
   troca de função, data do último exame e desligamento no demissional */
function aplicarEfeitosNoCadastro(e){
  const c = DB.colaboradores.find(x => norm(x.nome) === norm(e.colaborador));
  if(!c) return '';
  const avisos = [];
  /* 1. troca de função — o cargo escolhido na emissão passa a valer no cadastro */
  if(e.tipoExame === 'TROCA_FUNCAO' && e.funcao && norm(e.funcao) !== norm(c.funcao)){
    const antes = c.funcao;
    c.funcao = e.funcao;
    avisos.push('função atualizada: ' + (antes || '—') + ' → ' + e.funcao);
  }
  /* 2. data de emissão do ASO alimenta o exame vigente */
  if(e.dataAso){
    const aso = asoVigente(c.id);
    if(aso && aso.dataExame !== e.dataAso){
      aso.dataExame = e.dataAso;
      if(!aso.vencimento || aso.vencimento < e.dataAso) aso.vencimento = addDays(e.dataAso, 365);
    }
  }
  /* 3. demissional desliga o colaborador — sai da lista de ASOs em atraso */
  if(e.tipoExame === 'DEMISSIONAL' && c.status !== 'Desligado'){
    c.status = 'Desligado';
    avisos.push(c.nome + ' passou a Desligado');
  }
  return avisos.join(' · ');
}

/* dispara a sincronização com o módulo de ASOs e devolve um texto para o toast */
function aplicarSyncAso(e){
  /* exame realizado recebe o preço: 150 se tem laboratorial, 80 se só clínico */
  if(e.status === 'REALIZADO' && !Number(e.valor)) e.valor = precoEmissao(e);
  const r = sincronizarAsoDeEmissao(e);
  if(!r) return '';
  if(r.erro === 'sem-colaborador')
    return '⚠ ASO não atualizado: "' + e.colaborador + '" não está no cadastro de colaboradores';
  const txt = { criado:'ASO criado no módulo de ASOs', renovado:'ASO renovado (o anterior foi para o histórico)',
                atualizado:'ASO atualizado', vinculado:'ASO vinculado' };
  return txt[r.acao] || '';
}

/* ═══════════════════════════ 7. FATURAMENTO ═══════════════════════════ */
const UIFat = { unidade:'', mes:'', valorPadrao:'' };

function fechamentoDados(){
  const mes = UIFat.mes || mesFaturamentoPadrao();
  /* a coluna Fechamento é a ÚNICA referência do mês de faturamento —
     exame realizado sem fechamento fica pendente e não entra em mês nenhum */
  const ems = DB.emissoes.filter(e => {
    if(!exameEncerrado(e)) return false;
    return (e.fechamento||'').slice(0,7) === mes && (!UIFat.unidade || e.unidadeId === UIFat.unidade);
  });
  /* realizados ainda sem mês de fechamento (no escopo do filtro de unidade) */
  const pendentesFech = DB.emissoes.filter(e =>
    exameEncerrado(e) && !e.fechamento &&
    (!UIFat.unidade || e.unidadeId === UIFat.unidade));
  /* o valor do laudo vem da matriz de preço por unidade, não de um campo aberto */
  const lds = entregasLaudos(mes, UIFat.unidade).map(x => Object.assign({}, x.v, {
    unidadeId: x.laudo.unidadeId, laudoId: x.laudo.id, valor: precoLaudo(x.laudo.unidadeId)
  }));
  /* só visitas REALIZADAS entram no faturamento */
  const vis = (DB.visitas||[]).filter(v =>
    v.status === 'REALIZADO' &&
    (v.fechamento || v.mes || (v.data||'').slice(0,7)) === mes && (!UIFat.unidade || v.unidadeId === UIFat.unidade));

  /* mensalidades das unidades no escopo (fixas, independem de exame) */
  const unidadesEscopo = UIFat.unidade ? [uni(UIFat.unidade)].filter(Boolean) : DB.unidades;
  const mensais = unidadesEscopo.map(u => ({ unidadeId:u.id, valor: precoMensal(u.id) })).filter(m => m.valor > 0);
  const recMensal = mensais.reduce((s,m) => s + m.valor, 0);

  const exValidos = ems.filter(e => e.status === 'REALIZADO');   /* falta não fatura nem custa */

  /* carteirinhas sanitárias emitidas no mês (cobradas à parte do exame).
     Só entram as de exame realizado e de tipo que aceita carteirinha. */
  const carts = exValidos.filter(e => e.carteirinha && tipoAceitaCarteirinha(e.tipoExame));
  const recCart = carts.reduce((s,e) => s + precoCarteirinha(e.unidadeId), 0);
  const custoCart = carts.length * custoCarteirinha();

  /* RECEITA — o que as unidades pagam à Atlas */
  const recEx = exValidos.reduce((s,e) => s + (Number(e.valor)||0), 0);
  const recLd = lds.reduce((s,l) => s + (Number(l.valor)||0), 0);
  const recVi = vis.reduce((s,v) => s + (Number(v.valor)||0), 0);
  const receita = recEx + recLd + recVi + recMensal + recCart;

  /* CUSTO — o que a Atlas paga à Arys pelos exames e carteirinhas */
  const custoEx = exValidos.reduce((s,e) => s + custoEmissao(e), 0);
  const custo = custoEx + custoCart;

  /* informado o total cobrado, ele passa a ser o valor efetivo e manda na margem */
  const cobrado = totalCobrado(mes, UIFat.unidade);
  const efetivo = cobrado || receita;
  const margem = efetivo - custo;

  return {
    mes, ems, lds, vis, mensais, exValidos, pendentesFech, carts,
    recEx, recLd, recVi, recMensal, recCart, receita, cobrado, efetivo,
    custoEx, custoCart, custo, margem,
    /* aliases mantidos por compatibilidade */
    totalEx: recEx, totalLd: recLd, total: receita
  };
}
function mesFaturamentoPadrao(){
  const datas = DB.emissoes.map(e => e.fechamento).filter(Boolean).sort();
  return datas.length ? datas[datas.length-1].slice(0,7) : isoToday().slice(0,7);
}
/* preenche o fechamento de todos os realizados pendentes com o mês selecionado */
async function atribuirFechamentoPendentes(){
  const d = fechamentoDados();
  if(!d.pendentesFech.length) return;
  if(!confirm(`Definir ${mesLabel(d.mes)} como mês de fechamento de ${d.pendentesFech.length} exame(s) realizado(s) sem fechamento` +
              (UIFat.unidade ? ` da unidade ${uniNome(UIFat.unidade)}` : '') + `?\n\n` +
              `Um ponto de retorno será guardado em "Backup e segurança".`)) return;
  await guardarSnapshotLocal('antes de fechar exames em ' + d.mes);
  d.pendentesFech.forEach(e => { e.fechamento = d.mes; });
  save(); viewFaturamento();
  toast(d.pendentesFech.length + ' exame(s) fechado(s) em ' + mesLabel(d.mes) + '.');
}

function salvarPrecosUnidade(){
  const novo = {};
  document.querySelectorAll('#modalBody input[data-uni]').forEach(inp => {
    const u = inp.dataset.uni, k = inp.dataset.campo, val = inp.value.trim();
    if(val === '') return;

  });
  DB.precosUnidade = novo;
  save(); closeModal(); viewFaturamento();
  const n = Object.keys(novo).length;

/* ---- gerador de e-mail de fechamento (multi-unidade, formato do cliente) ---- */
const UIEmail = { unidades: [] };

function gerarEmailCobranca(){
  /* seleção inicial: a unidade do filtro, ou todas com movimento no mês */
  const mes = UIFat.mes || mesFaturamentoPadrao();
  if(UIFat.unidade) UIEmail.unidades = [UIFat.unidade];
  else if(!UIEmail.unidades.length){
    const comMov = new Set();
    DB.emissoes.forEach(e => { if((e.fechamento||(e.dataClinico||e.dataLab||'').slice(0,7))===mes && e.status==='REALIZADO') comMov.add(e.unidadeId); });
    UIEmail.unidades = [...comMov];
  }
  abrirModalEmail(mes);
}

function abrirModalEmail(mes){
  mes = mes || UIFat.mes || mesFaturamentoPadrao();
  /* agrupa unidades por empresa para facilitar (ex.: marcar as 3 da Qualy) */
  const porEmp = {};
  DB.unidades.forEach(u => { (porEmp[u.empresaId] = porEmp[u.empresaId] || []).push(u); });

          <label class="flex items-center gap-1.5 text-xs px-2 py-1 rounded hover:bg-slate-50 cursor-pointer">
            <input type="checkbox" class="emailUni w-4 h-4 rounded border-slate-300 text-accent" value="${u.id}" ${UIEmail.unidades.includes(u.id)?'checked':''}>
            <span class="truncate" title="${esc(u.nome)}">${esc(u.sigla)}</span></label>`).join('')}

        </div>
      </div>
      <button onclick="renderPreviewEmail()" class="px-4 py-2 rounded-lg text-sm bg-accent text-white hover:bg-blue-700">

      <div id="emailWrap"></div>
    </div>`, 'max-w-5xl');

/* monta o e-mail HTML no formato usado com os clientes */
function montarEmail(unidadeIds, mes){
  const ems = DB.emissoes.filter(e => {
    if(e.status !== 'REALIZADO') return false;
    return (e.fechamento||'').slice(0,7) === mes && unidadeIds.includes(e.unidadeId);
  }).sort((a,b) => (a.dataClinico||a.dataLab||'').localeCompare(b.dataClinico||b.dataLab||''));
  const lds = [], vis = [], mensais = [];
  unidadeIds.forEach(uid2 => {
    entregasLaudos(mes, uid2).forEach(x => lds.push(Object.assign({ unidadeId:x.laudo.unidadeId }, x.v)));
  });
  (DB.visitas||[]).forEach(v => { if(v.status==='REALIZADO' && (v.fechamento||v.mes||(v.data||'').slice(0,7))===mes && unidadeIds.includes(v.unidadeId)) vis.push(v); });
  unidadeIds.forEach(uid2 => { const m = precoMensal(uid2); if(m>0) mensais.push({ unidadeId:uid2, valor:m }); });

  const unidades = unidadeIds.map(uni).filter(Boolean);
  const siglas = unidades.map(u => u.sigla).join(', ');
  const cidades = [...new Set(unidades.map(u => (u.cidade||u.nome)))].join(', ').toUpperCase();
  const [my, mm] = mes.split('-');
  const nomesMes = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const mesBarra = (nomesMes[Number(mm)-1]||'') + '/' + my;
  const assunto = `Fechamento Mensal: Exames Clínicos e Laboratoriais de ${mesBarra} - ${siglas}`;

  const recEx = ems.reduce((s,e)=>s+(Number(e.valor)||0),0);
  const recLd = lds.reduce((s,l)=>s+(Number(l.valor)||0),0);
  const recVi = vis.reduce((s,v)=>s+(Number(v.valor)||0),0);
  const recMe = mensais.reduce((s,m)=>s+(Number(m.valor)||0),0);
  const carts = ems.filter(e => e.carteirinha && tipoAceitaCarteirinha(e.tipoExame));
  const recCa = carts.reduce((s,e)=>s+precoCarteirinha(e.unidadeId),0);
  const total = recEx+recLd+recVi+recMe+recCa;

  const th = 'style="background:#1e293b;color:#fff;padding:6px 8px;text-align:left;font-size:12px;border:1px solid #cbd5e1"';
  const td = 'style="padding:6px 8px;border:1px solid #cbd5e1;font-size:12px"';
  const NoX = v => (v && String(v).trim()) ? esc(String(v)) : 'x';

  const tabExames = ems.length ? `
    <table style="border-collapse:collapse;width:100%;margin:8px 0">
      <thead><tr>
        <th ${th}>Colaborador</th><th ${th}>Local</th><th ${th}>Exame Laboratório</th><th ${th}>Laboratório</th>
        <th ${th}>Data</th><th ${th}>Exame Clínico</th><th ${th}>Médico</th><th ${th}>Carteirinha</th><th ${th}>Data</th>
      </tr></thead>
      <tbody>
        ${ems.map(e => `<tr>
          <td ${td}>${esc(e.colaborador)}</td>
          <td ${td}>${esc((uni(e.unidadeId)||{}).sigla||'')}</td>
          <td ${td}>${NoX(e.exameLab)}</td>
          <td ${td}>${NoX(e.laboratorio)}</td>
          <td ${td}>${e.dataLab?fmtDate(e.dataLab):'x'}</td>
          <td ${td}>${esc(tipoLabel(e.tipoExame))}</td>
          <td ${td}>${NoX(e.medico)}</td>
          <td ${td}>${e.carteirinha && tipoAceitaCarteirinha(e.tipoExame) ? 'SIM' : 'NÃO'}</td>
          <td ${td}>${fmtDate(e.dataClinico||e.dataLab)}</td>
        </tr>`).join('')}
      </tbody></table>` : '<p style="font-size:13px">Nenhum exame no período.</p>';

  const tabLaudos = lds.length ? `
    <p style="font-size:13px;margin:14px 0 4px"><b>Laudos técnicos (PCMSO / PGR / LTCAT)</b></p>
    <table style="border-collapse:collapse;width:100%;margin:4px 0">
      <thead><tr><th ${th}>Unidade</th><th ${th}>Documentos</th><th ${th}>Emissão</th><th ${th}>Valor</th></tr></thead>
      <tbody>${lds.map(l => `<tr><td ${td}>${esc(uniNome(l.unidadeId))}</td><td ${td}>${esc(docsLabel(l.documentos))}</td><td ${td}>${fmtDate(l.emissao)}</td><td ${td}>${fmtMoney(l.valor||0)}</td></tr>`).join('')}</tbody>
    </table>` : '';

  const tabVisitas = vis.length ? `
    <p style="font-size:13px;margin:14px 0 4px"><b>Visitas técnicas</b></p>
    <table style="border-collapse:collapse;width:100%;margin:4px 0">
      <thead><tr><th ${th}>Unidade</th><th ${th}>Data</th><th ${th}>Observação</th><th ${th}>Valor</th></tr></thead>
      <tbody>${vis.map(v => `<tr><td ${td}>${esc(uniNome(v.unidadeId))}</td><td ${td}>${fmtDate(v.data)}</td><td ${td}>${esc(v.obs||'')}</td><td ${td}>${fmtMoney(v.valor||0)}</td></tr>`).join('')}</tbody>
    </table>` : '';

  const tabCarts = carts.length ? `
    <p style="font-size:13px;margin:14px 0 4px"><b>Carteirinhas sanitárias emitidas</b></p>
    <table style="border-collapse:collapse;width:100%;margin:4px 0">
      <thead><tr><th ${th}>Colaborador</th><th ${th}>Local</th><th ${th}>Data</th><th ${th}>Valor</th></tr></thead>
      <tbody>${carts.map(e => `<tr><td ${td}>${esc(e.colaborador)}</td>
        <td ${td}>${esc((uni(e.unidadeId)||{}).sigla||'')}</td>
        <td ${td}>${fmtDate(e.dataClinico||e.dataLab)}</td>
        <td ${td}>${fmtMoney(precoCarteirinha(e.unidadeId))}</td></tr>`).join('')}
        <tr><td ${td} colspan="3"><b>Total — ${carts.length} carteirinha(s)</b></td><td ${td}><b>${fmtMoney(recCa)}</b></td></tr>
      </tbody>
    </table>` : '';

  const tabMensais = mensais.length ? `
    <p style="font-size:13px;margin:14px 0 4px"><b>Mensalidades</b></p>
    <table style="border-collapse:collapse;width:100%;margin:4px 0">
      <thead><tr><th ${th}>Unidade</th><th ${th}>Valor mensal</th></tr></thead>
      <tbody>${mensais.map(m => `<tr><td ${td}>${esc(uniNome(m.unidadeId))}</td><td ${td}>${fmtMoney(m.valor)}</td></tr>`).join('')}</tbody>
    </table>` : '';

  /* unidades selecionadas que não têm nada a cobrar no mês */
  const temCobranca = id =>
    ems.some(e => e.unidadeId===id) || lds.some(l => l.unidadeId===id) ||
    vis.some(v => v.unidadeId===id) || mensais.some(m => m.unidadeId===id);
  const semCobranca = unidades.filter(u => !temCobranca(u.id));
  const totalGeralZero = total === 0 && !ems.length && !lds.length && !vis.length && !mensais.length && !carts.length;

  const notaSemCobranca = totalGeralZero
    ? `<p><b>Não haverá cobrança referente a este período.</b> Não houve exames, laudos, visitas técnicas ou mensalidades a faturar no mês de ${mesLabel(mes)}.</p>`
    : (semCobranca.length
        ? `<p style="color:#475569"><i>Observação:</i> ${semCobranca.length>1?'as unidades':'a unidade'}
           <b>${semCobranca.map(u=>esc(u.nome)).join(', ')}</b> não ${semCobranca.length>1?'tiveram':'teve'} cobrança neste período.</p>`
        : '');

  const corpoProcedimentos = totalGeralZero ? '' : `
    <p>Segue os ASOs e o resumo dos procedimentos realizados:</p>
    ${tabExames}${tabCarts}${tabLaudos}${tabVisitas}${tabMensais}`;

  const html = `<div style="font-family:Arial,Helvetica,sans-serif;color:#1e293b;font-size:13px;line-height:1.5">
    <p>Prezados,</p>
    <p>Gostaria de compartilhar o fechamento referente aos exames clínicos e laboratoriais realizados pelos colaboradores
    ${unidades.length>1?'das unidades':'da unidade'} de <b>${esc(cidades)}</b> durante o mês de <b>${mesLabel(mes)}</b>.</p>
    ${notaSemCobranca}${corpoProcedimentos}
    <p>Permanecemos à disposição para qualquer esclarecimento.</p>
    <p>Atenciosamente,<br>Gestão Atlas — Medicina Ocupacional e SST</p>
  </div>`;
  return { assunto, html, vazio: totalGeralZero };
}

function copiarEmailRico(){
  const corpo = document.getElementById('emailCorpo');
  const html = corpo.innerHTML, texto = corpo.innerText;
  const ok = () => toast('E-mail copiado — cole no Gmail/Outlook.');
  if(navigator.clipboard && window.ClipboardItem){
    navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], {type:'text/html'}),
      'text/plain': new Blob([texto], {type:'text/plain'})
    })]).then(ok).catch(() => selecionarECopiar(corpo));
  } else selecionarECopiar(corpo);
}
function selecionarECopiar(el){
  const r = document.createRange(); r.selectNodeContents(el);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  try{ document.execCommand('copy'); toast('E-mail copiado.'); }catch(e){ toast('Não foi possível copiar.', 'erro'); }
  s.removeAllRanges();
}
function copiarAssunto(){
  const t = document.getElementById('emAssunto').textContent;
  navigator.clipboard.writeText(t).then(() => toast('Assunto copiado.')).catch(()=>toast('Assunto copiado.'));
}
function baixarEmail(){
  const mes = document.getElementById('emMes').value;
  const assunto = document.getElementById('emAssunto').textContent;
  const corpo = document.getElementById('emailCorpo').innerHTML;
  baixar('email-fechamento-' + mes + '.html',
    '<!doctype html><meta charset="utf-8"><title>' + esc(assunto) + '</title>' + corpo, 'text/html');
}
function exportarFaturamento(){
  const d = fechamentoDados();
  const linhas = d.ems.map(e => ['Exame', e.colaborador, uniNome(e.unidadeId), tipoLabel(e.tipoExame),
      e.exameLab || '', fmtDate(e.dataAso||e.dataClinico||e.dataLab) || mesLabel(e.fechamento),
      FLUXO_LABEL[e.status]||e.status,
      naoCompareceu(e) ? 0 : custoEmissao(e), naoCompareceu(e) ? 0 : (Number(e.valor)||0)])
    .concat(d.lds.map(l => ['Laudo', docsLabel(l.documentos), uniNome(l.unidadeId), '', '',
      fmtDate(l.dataFaturamento), l.pagamento||'Solicitado', 0, Number(l.valor)||0]))
    .concat(d.vis.map(v => ['Visita técnica', v.obs||'', uniNome(v.unidadeId), '', '',
      fmtDate(v.data), '', 0, Number(v.valor)||0]))
    .concat(d.carts.map(e => ['Carteirinha sanitária', e.colaborador, uniNome(e.unidadeId), '', '',
      fmtDate(e.dataClinico||e.dataLab) || mesLabel(e.fechamento), 'Emitida',
      custoCarteirinha(), precoCarteirinha(e.unidadeId)]))
    .concat(d.mensais.map(m => ['Mensalidade', '', uniNome(m.unidadeId), '', '',
      mesLabel(d.mes), '', 0, Number(m.valor)||0]));
  linhas.push(['TOTAIS','','','','','','', d.custo, d.receita]);

  exportCSV('faturamento-' + d.mes,

}

function editarVisita(id){
  const v = id ? (DB.visitas||[]).find(x => x.id === id) : null;
  openForm({
    title: v ? 'Editar visita técnica' : 'Nova visita técnica',
    fields: [
      { name:'unidadeId', label:'Unidade', type:'select', options:opcoesUnidades().map(o=>({v:o.v,l:o.l})), req:true },
      { name:'status', label:'Situação', type:'select', options:VIS_FLUXO.map(f=>({v:f,l:FLUXO_LABEL[f]})) },
      { name:'data', label:'Data da visita', type:'date', req:true },
      { name:'fechamento', label:'Mês de faturamento', type:'month', hint:'usado só quando Realizada; em branco = mês da visita' },
      { name:'valor', label:'Valor (R$)', type:'number', step:'0.01' },
      { name:'obs', label:'Observação', type:'textarea', rows:2, col:'sm:col-span-2' }
    ],
    values: v || { data: isoToday(), status:'SOLICITADO', valor: precoVisita(UIVis.uni||''), unidadeId: UIVis.uni || '' },
    afterRender: form => {
      const selUni = form.elements['unidadeId'], inpVal = form.elements['valor'];
      selUni.addEventListener('change', () => { if(!Number(inpVal.value)) inpVal.value = precoVisita(selUni.value); });
    },
    onSave: dados => {
      const reg = { unidadeId:dados.unidadeId, status:dados.status||'SOLICITADO', data:dados.data,
                    valor:Number(dados.valor)||0, obs:dados.obs, mes:(dados.data||'').slice(0,7),
                    fechamento: dados.fechamento || (dados.data||'').slice(0,7) };
      if(v) Object.assign(v, reg);
      else { DB.visitas = DB.visitas || []; DB.visitas.push(Object.assign({ id: uid('vt') }, reg)); }
      save(); closeModal(); viewVisitas(); toast('Visita técnica salva.');
    }
  });
}
function setStatusVisita(id, status){
  const v = (DB.visitas||[]).find(x => x.id === id); if(!v) return;
  v.status = status;
  if(status === 'REALIZADO' && !v.fechamento) v.fechamento = (v.data||'').slice(0,7);
  save(); viewVisitas();
  toast('Situação: ' + FLUXO_LABEL[status] + (status==='REALIZADO' ? ' · entra no faturamento de ' + mesLabel(v.fechamento||(v.data||'').slice(0,7)) : ''));
}
function setFechamentoVisita(id, mes){
  const v = (DB.visitas||[]).find(x => x.id === id); if(!v) return;
  v.fechamento = mes || (v.data||'').slice(0,7);
  save(); viewVisitas();
  toast('Visita entra no faturamento de ' + mesLabel(v.fechamento));
}
function excluirVisita(id){
  if(!confirm('Excluir esta visita técnica?')) return;
  DB.visitas = (DB.visitas||[]).filter(x => x.id !== id);
  save(); viewVisitas(); toast('Visita excluída.');
}
function exportarVisitas(){
  exportCSV('visitas-tecnicas', ['Unidade','Data','Observação','Valor','Situação'],
    visitasFiltradas().map(v => [uniNome(v.unidadeId), fmtDate(v.data), v.obs||'', Number(v.valor)||0, FLUXO_LABEL[v.status]||v.status]));
}

function editarDoc(id, tipoNovo){

function atualizaSubtotais(){
  let total = 0;
  document.querySelectorAll('#docItens tr[data-i]').forEach(r => {
    const q = Number(r.querySelector('[data-f=qtd]').value)||0, v = Number(r.querySelector('[data-f=valor]').value)||0;
    const sub = q*v; total += sub;
    r.querySelector('[data-sub]').textContent = fmtMoney(sub);
  });
  const t = document.getElementById('docTotal'); if(t) t.textContent = fmtMoney(total);

function duplicarDoc(id){
  const x = (DB.docsOficiais||[]).find(d => d.id === id); if(!x) return;
  const novo = JSON.parse(JSON.stringify(x));
  novo.id = uid('doc'); novo.numero = proximoNumeroDoc(x.tipo); novo.data = isoToday(); novo.criadoEm = new Date().toISOString();
  DB.docsOficiais.push(novo); save(); viewDocumentos(); toast('Documento duplicado — edite o que precisar.');
  editarDoc(novo.id);
}
function excluirDoc(id){
  if(!confirm('Excluir este documento?')) return;
  DB.docsOficiais = DB.docsOficiais.filter(d => d.id !== id);
  save(); viewDocumentos(); toast('Documento excluído.');
}

/* consolidado corporativo do mês — base do relatório executivo.
   unidadeIds vazio/ausente = todas as unidades com registro no período. */
function dadosCorporativo(mes, unidadeIds){
  const filtra = unidadeIds && unidadeIds.length;
  const doMes = (DB.atestados||[]).filter(a =>
    (a.data||'').slice(0,7) === mes && (!filtra || unidadeIds.includes(a.unidadeId)));
  const total = doMes.length;
  const dias = doMes.reduce((s,a) => s + (Number(a.dias)||1), 0);

  /* ranking por unidade */
  const mapa = {};
  doMes.forEach(a => {
    const k = a.unidadeId || '—';
    (mapa[k] = mapa[k] || { unidadeId:k, qtd:0, dias:0, cids:{}, colabs:{} });
    mapa[k].qtd++; mapa[k].dias += Number(a.dias)||1;
    const cid = String(a.cid||'').trim().toUpperCase();
    if(cid) mapa[k].cids[cid] = (mapa[k].cids[cid]||0) + 1;
    if(a.colaborador) mapa[k].colabs[a.colaborador] = (mapa[k].colabs[a.colaborador]||0) + 1;
  });
  const porUnidade = Object.values(mapa).map(u => Object.assign(u, {
    sigla: (uni(u.unidadeId)||{sigla:'—'}).sigla,
    nome: u.unidadeId==='—' ? 'Sem unidade' : uniNome(u.unidadeId),
    pct: total ? (u.qtd/total*100) : 0,
    topCids: Object.entries(u.cids).sort((a,b)=>b[1]-a[1]).slice(0,3),
    recorrentes: Object.entries(u.colabs).filter(x=>x[1]>1).sort((a,b)=>b[1]-a[1])
  })).sort((a,b) => b.qtd - a.qtd);

  /* série do ano corrente, para o comparativo temporal (mesmo recorte de unidades) */
  const ano = mes.slice(0,4);
  const porMes = {};
  (DB.atestados||[]).forEach(a => {
    if(filtra && !unidadeIds.includes(a.unidadeId)) return;
    const m = (a.data||'').slice(0,7);
    if(m.slice(0,4) === ano) porMes[m] = (porMes[m]||0) + 1;
  });
  const serieMensal = Object.keys(porMes).sort().map((m,i,arr) => {
    const ant = i > 0 ? porMes[arr[i-1]] : null;
    return { mes:m, total:porMes[m], variacao: ant ? ((porMes[m]-ant)/ant*100) : null };
  });

  /* saúde mental e qualidade do registro */
  const mentais = doMes.filter(a => letraCid(a.cid) === 'F');
  const cidFporUnidade = {};
  mentais.forEach(a => { const s = (uni(a.unidadeId)||{sigla:'—'}).sigla; cidFporUnidade[s] = (cidFporUnidade[s]||0) + 1; });
  const semCid = doMes.filter(a => !String(a.cid||'').trim()).length;
  const colaboradores = new Set(doMes.map(a => norm(a.colaborador)).filter(Boolean)).size;

  const capitulos = {};
  doMes.forEach(a => { const L = letraCid(a.cid); if(L) capitulos[L] = (capitulos[L]||0) + 1; });

  /* unidades afetadas por tema, para as recomendações estratégicas */
  const temaDe = L => (L==='F' ? 'psico'
    : (['J','A','B'].includes(L) ? 'resp'
    : (['M','G','S'].includes(L) ? 'ergo' : '')));
  const temas = { psico:new Set(), resp:new Set(), ergo:new Set() };
  doMes.forEach(a => {
    const t = temaDe(letraCid(a.cid));
    if(t) temas[t].add((uni(a.unidadeId)||{sigla:'—'}).sigla);
  });

  return { mes, total, dias, colaboradores, porUnidade, serieMensal, mentais,
           cidFporUnidade, semCid, capitulos,
           temas: { psico:[...temas.psico], resp:[...temas.resp], ergo:[...temas.ergo] } };
}

const UIAte = { q:'', uni:'', mes:'', page:1 };

function mesAtestadoPadrao(){
  const ds = (DB.atestados||[]).map(a => a.data).filter(Boolean).sort();
  return ds.length ? ds[ds.length-1].slice(0,7) : isoToday().slice(0,7);
}
/* recorte usado nos indicadores e no relatório */
function dadosNR01(){
  const mes = UIAte.mes || mesAtestadoPadrao();
  const doMes = (DB.atestados||[]).filter(a => (a.data||'').slice(0,7) === mes);
  const daUnidade = UIAte.uni ? doMes.filter(a => a.unidadeId === UIAte.uni) : doMes;

  const porUnidade = {}, porCid = {}, porColab = {}, porCapitulo = {}, porMotivo = {};
  doMes.forEach(a => { porUnidade[a.unidadeId||'—'] = (porUnidade[a.unidadeId||'—']||0) + 1; });
  daUnidade.forEach(a => {
    const cid = String(a.cid||'').trim().toUpperCase() || 'SEM CID';
    porCid[cid] = (porCid[cid]||0) + 1;
    const L = letraCid(cid); if(L) porCapitulo[L] = (porCapitulo[L]||0) + 1;
    if(a.colaborador) porColab[a.colaborador] = (porColab[a.colaborador]||0) + 1;
    if(a.motivo) porMotivo[a.motivo] = (porMotivo[a.motivo]||0) + 1;
  });
  const mentais = daUnidade.filter(a => letraCid(a.cid) === 'F');
  const dias = daUnidade.reduce((s,a) => s + (Number(a.dias)||1), 0);
  return { mes, doMes, lista:daUnidade, porUnidade, porCid, porColab, porCapitulo, porMotivo,
           mentais, dias, colaboradores:Object.keys(porColab).length };
}

  const q = norm(UIAte.q);

  const a = id ? (DB.atestados||[]).find(x => x.id === id) : null;
  openForm({
    title: a ? 'Editar atestado' : 'Novo atestado',
    fields: [
      { name:'colaborador', label:'Colaborador', req:true, col:'sm:col-span-2', type:'datalist',
        options: DB.colaboradores.slice().sort((x,y)=>x.nome.localeCompare(y.nome,'pt-BR')).map(c => c.nome) },
      { name:'unidadeId', label:'Unidade', type:'select', options:opcoesUnidades().map(o=>({v:o.v,l:o.l})), req:true },
      { name:'data', label:'Início do afastamento', type:'date', req:true },
      { name:'dias', label:'Dias de afastamento', type:'number', step:'1' },
      { name:'cid', label:'CID', ph:'Ex.: F32', hint:'a letra define o capítulo e a recomendação técnica' },
      { name:'medico', label:'Médico emissor', col:'sm:col-span-2' },

    ],
    values: a || { data: isoToday(), dias:1, unidadeId: UIAte.uni || '', motivo:'Atestado Médico' },
    afterRender: form => {
      const inp = form.elements['colaborador'], selU = form.elements['unidadeId'];

      });

    onSave: v => {

                    dias:Number(v.dias)||1, cid:(v.cid||'').toUpperCase(), motivo:v.motivo, medico:v.medico };

function limparAtestados(){
  const total = (DB.atestados||[]).length;
  if(!total){ toast('Não há atestados para limpar.', 'alerta'); return; }
  const mes = UIAte.mes || mesAtestadoPadrao();
  const doMes = (DB.atestados||[]).filter(a => (a.data||'').slice(0,7) === mes).length;

  openInfo('Limpar atestados', `
    <div class="space-y-4">
      <div class="bg-amber-50 border border-amber-200 rounded-lg px-4 py-3 text-xs text-amber-900">
        <i class="fa-solid fa-circle-info mr-1"></i>Um <b>ponto de retorno</b> é guardado antes de apagar —
        dá para desfazer em <b>Backup e segurança</b>.
      </div>
      <p class="text-sm text-slate-600">Há <b>${total}</b> atestado(s) na base, sendo <b>${doMes}</b> em ${mesLabel(mes)}.</p>
      <div class="grid gap-2">
        <button onclick="confirmarLimpeza('mes','${mes}')" ${doMes?'':'disabled'}
          class="w-full text-left px-4 py-3 rounded-lg border border-slate-300 hover:border-accent hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed">
          <p class="font-medium text-sm text-slate-700"><i class="fa-solid fa-calendar-xmark mr-2 text-slate-400"></i>Apagar só ${mesLabel(mes)}</p>
          <p class="text-xs text-slate-500 mt-0.5">${doMes} registro(s) — mantém os demais meses</p>
        </button>
        <button onclick="confirmarLimpeza('tudo')"
          class="w-full text-left px-4 py-3 rounded-lg border border-red-200 hover:border-danger hover:bg-red-50">
          <p class="font-medium text-sm text-danger"><i class="fa-solid fa-trash mr-2"></i>Apagar todos os atestados</p>
          <p class="text-xs text-slate-500 mt-0.5">${total} registro(s) — zera o módulo para reimportar do zero</p>
        </button>
      </div>
    </div>`, 'max-w-lg');
}
async function confirmarLimpeza(escopo, mes){
  const antes = (DB.atestados||[]).length;
  const alvo = escopo === 'mes'
    ? `os atestados de ${mesLabel(mes)}`
    : `TODOS os ${antes} atestados`;
  if(!confirm(`Apagar ${alvo}?\n\nUm ponto de retorno será guardado em "Backup e segurança".`)) return;
  await guardarSnapshotLocal(escopo === 'mes' ? 'antes de limpar atestados de ' + mesLabel(mes) : 'antes de limpar todos os atestados');
  DB.atestados = escopo === 'mes'
    ? (DB.atestados||[]).filter(a => (a.data||'').slice(0,7) !== mes)
    : [];
  const apagados = antes - DB.atestados.length;
  save(); closeModal(); viewAtestados();
  toast(apagados + ' atestado(s) apagado(s). Pode importar a planilha novamente.');
}

function excluirAtestado(id){
  if(!confirm('Excluir este atestado?')) return;
  DB.atestados = (DB.atestados||[]).filter(x => x.id !== id);
  save(); viewAtestados(); toast('Atestado excluído.');
}
function exportarAtestados(){
  exportCSV('atestados-'+(UIAte.mes||mesAtestadoPadrao()),

              L?(CID_CAPITULO[L]||''):'', a.motivo, a.medico]; }));

/* importa a planilha detalhada (mesmo layout usado hoje) */
function importarAtestados(input){
  const f = input.files[0]; if(!f) return;
  if(typeof XLSX === 'undefined'){ toast('Biblioteca de planilhas indisponível — verifique a internet.', 'erro'); input.value=''; return; }
  const r = new FileReader();
  r.onload = ev => {
    try{
      const wb = XLSX.read(new Uint8Array(ev.target.result), { type:'array', cellDates:true });
      const nomeAba = wb.SheetNames.find(n => norm(n).includes('DETALHADA')) || wb.SheetNames[0];
      const linhas = XLSX.utils.sheet_to_json(wb.Sheets[nomeAba], { defval:'' });
      if(!linhas.length){ toast('A planilha está vazia.', 'erro'); return; }

      const keys = Object.keys(linhas[0]);
      const acha = (...alvos) => keys.find(k => alvos.some(alvo => norm(k).includes(alvo)));
      const col = {
        loc: acha('LOCAL','UNIDADE','SALA'), dia: acha('DIA','DATA'), cid: acha('CID'),
        fun: acha('FUNCIONARIO','COLABORADOR','NOME'), mot: acha('MOTIVO','OBSERV'),
        dias: acha('DIAS','QTD'), med: acha('MEDICO','EMISSOR')
      };
      if(!col.dia || !col.fun){ toast('Não encontrei as colunas de data e funcionário na planilha.', 'erro'); return; }

      const paraISO = v => {
        if(v instanceof Date && !isNaN(v)) return toISO(v);
        const s = String(v||'').trim();
        const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
        if(m){ const ano = m[3].length===2 ? '20'+m[3] : m[3];
          return ano+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); }
        return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0,10) : '';
      };
      /* casa o texto da planilha com as unidades cadastradas.
         O relatório usa "Sala Confins - CNF": a sigla vem depois do último hífen. */
      const achaUnidade = txt => {
        const bruto = String(txt||'').trim();
        const n = norm(bruto); if(!n) return '';
        const sufixo = norm(bruto.split(/[-–]/).pop());          /* "CNF" */
        const acha = f => { const u = DB.unidades.find(f); return u ? u.id : ''; };
        return acha(x => norm(x.sigla) === sufixo)               /* sigla explícita no fim */
            || acha(x => norm(x.sigla) === n || norm(x.nome) === n)
            || acha(x => (x.aliases||[]).some(al => norm(al) === n || norm(al) === sufixo))
            || acha(x => norm(x.nome).includes(n) || (sufixo.length >= 3 && n.includes(norm(x.sigla))))
            || '';
      };

      /* SÓ atestados médicos entram — faltas, dispensas e suspensões são ignoradas */
      const ehAtestado = l => norm(col.mot ? l[col.mot] : '').includes('ATESTADO');
      const limpaCid = v => {
        const c = String(v||'').trim().toUpperCase();
        return (!c || norm(c).includes('SEMCID')) ? '' : c;
      };

      const candidatas = [];
      let ignoradas = 0;
      linhas.forEach(l => {
        if(!ehAtestado(l)){ ignoradas++; return; }
        const nome = maiusc(l[col.fun]);
        const data = paraISO(l[col.dia]);
        if(!nome || !data) return;
        candidatas.push({
          nome, data,
          unidadeId: achaUnidade(col.loc ? l[col.loc] : ''),
          cid: limpaCid(col.cid ? l[col.cid] : ''),
          motivo: String(col.mot ? l[col.mot] : '').trim(),
          medico: String(col.med ? l[col.med] : '').trim()
        });
      });

      /* a planilha traz uma linha por DIA — agrupa dias consecutivos do mesmo
         colaborador com o mesmo CID em um único atestado de N dias */
      candidatas.sort((a,b) => norm(a.nome).localeCompare(norm(b.nome)) ||
                               norm(a.cid).localeCompare(norm(b.cid)) ||
                               a.data.localeCompare(b.data));
      const grupos = [];
      candidatas.forEach(c => {
        const ult = grupos[grupos.length-1];
        const seguido = ult && norm(ult.nome)===norm(c.nome) && norm(ult.cid)===norm(c.cid) &&
                        addDays(ult.ultimaData, 1) === c.data;
        if(seguido){ ult.dias++; ult.ultimaData = c.data; if(!ult.medico) ult.medico = c.medico; }
        else grupos.push(Object.assign({}, c, { dias:1, ultimaData:c.data }));
      });

      let novos = 0, semUnidade = 0, repetidos = 0;
      const existe = (nome, data) => (DB.atestados||[]).some(a => norm(a.colaborador)===norm(nome) && a.data===data);
      DB.atestados = DB.atestados || [];
      grupos.forEach(g => {
        if(existe(g.nome, g.data)){ repetidos++; return; }
        if(!g.unidadeId) semUnidade++;
        DB.atestados.push({
          id: uid('at'), colaborador: g.nome, unidadeId: g.unidadeId, data: g.data,
          dias: g.dias, cid: g.cid, motivo: g.motivo, medico: g.medico,
          origem: 'Planilha ' + f.name
        });
        novos++;
      });
      if(novos) UIAte.mes = DB.atestados[DB.atestados.length-1].data.slice(0,7);
      save(); viewAtestados();
      toast(`${novos} atestado(s) importado(s).` +
            (ignoradas?` ${ignoradas} linha(s) ignorada(s) (faltas, dispensas e suspensões).`:'') +
            (repetidos?` ${repetidos} já existiam.`:'') +
            (semUnidade?` ⚠ ${semUnidade} sem unidade reconhecida.`:''), novos?'ok':'alerta');
    }catch(err){ toast('Falha ao ler a planilha: ' + err.message, 'erro'); }
    input.value = '';
  };
  r.readAsArrayBuffer(f);
}

/* ---- Relatório NR-01 no papel timbrado ---- */
function graficoParaImagem(cfg, largura, altura){
  const cv = document.createElement('canvas');
  cv.width = largura; cv.height = altura;
  cfg.options = Object.assign({}, cfg.options, { responsive:false, animation:false, devicePixelRatio:2 });
  const ch = new Chart(cv.getContext('2d'), cfg);
  const url = cv.toDataURL('image/png');
  ch.destroy();
  return url;
}

function setTipoRelatorio(t){ UIRelGer.tipo = t; renderModalRelatorio(); }

      .map(u => ({ v:u.id, l: u.nome + ' (' + u.sigla + ')' + (volume[u.id]?' · '+volume[u.id]+' atestado(s)':' · sem registros') })));
  const seletorUni = `
    <div>
      <label class="block text-xs font-medium text-slate-600 mb-1">Unidade do relatório</label>
      <select id="relUnicaUni" onchange="UIRelGer.unidade=this.value;atualizaResumoRel()"

        ${opcoesUni.map(o => `<option value="${esc(o.v)}" ${o.v===UIRelGer.unidade?'selected':''}>${esc(o.l)}</option>`).join('')}

}

function marcarUnidadesRel(marcar){
  document.querySelectorAll('.relUni').forEach(cb => { cb.checked = marcar; });
  atualizaResumoRel();
}
function unidadesRelSelecionadas(){
  return [...document.querySelectorAll('.relUni:checked')].map(cb => cb.value);
}
function atualizaResumoRel(){
  const el = document.getElementById('relResumoSel'); if(!el) return;
  const mes = UIAte.mes || mesAtestadoPadrao();
  if(UIRelGer.tipo === 'CORPORATIVO'){
    const ids = unidadesRelSelecionadas();
    if(!ids.length){ el.innerHTML = '<span class="text-danger">Selecione ao menos uma unidade.</span>'; return; }
    const c = dadosCorporativo(mes, ids);
    el.textContent = `${ids.length} unidade(s) · ${c.total} atestado(s) · ${c.dias} dia(s) · ${c.mentais.length} CID F`;
  }else{
    const ids = UIRelGer.unidade ? [UIRelGer.unidade] : null;
    const c = dadosCorporativo(mes, ids);
    const nome = UIRelGer.unidade ? uniNome(UIRelGer.unidade) : 'Todas as unidades';
    el.textContent = `${nome} · ${c.total} atestado(s) · ${c.dias} dia(s) · ${c.mentais.length} CID F`;
  }
}
/* lê a escolha ainda com a modal aberta e então emite */
function emitirRelatorio(comTimbrado){
  const mes = UIAte.mes || mesAtestadoPadrao();
  if(UIRelGer.tipo === 'CORPORATIVO'){
    const ids = unidadesRelSelecionadas();
    if(!ids.length){ toast('Selecione ao menos uma unidade.', 'erro'); return; }
    closeModal();
    montarRelatorioCorporativo(comTimbrado, ids);
  }else{
    const sel = document.getElementById('relUnicaUni');
    UIAte.uni = sel ? sel.value : UIRelGer.unidade;
    UIAte.page = 1;
    closeModal();
    montarRelatorioNR01(comTimbrado);
  }
}

function montarRelatorioNR01(comTimbrado, acao){
  const d = dadosNR01();
  if(!d.lista.length){ toast('Não há atestados no período selecionado.', 'alerta'); return; }
  const alvo = UIAte.uni;
  const nomeUnidade = alvo ? uniNome(alvo) : 'Todas as unidades';

  /* 1 — panorama por unidade */
  const uniLabels = Object.keys(d.porUnidade).sort((a,b)=>d.porUnidade[b]-d.porUnidade[a]);
  const imgPanorama = graficoParaImagem({
    type:'bar',
    data:{ labels: uniLabels.map(k => (uni(k)||{sigla:'—'}).sigla),
      datasets:[{ data: uniLabels.map(k => d.porUnidade[k]),
        backgroundColor: uniLabels.map(k => k===alvo ? PALETA.avencer : '#d6d6d3'), borderRadius:3 }] },
    options:{ indexAxis:'y', plugins:{ legend:{display:false} },
      scales:{ x:{ beginAtZero:true, ticks:{precision:0} } } }
  }, 900, Math.max(220, uniLabels.length*30 + 40));

  /* 2 — capítulos do CID */
  const caps = Object.entries(d.porCapitulo).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const imgCid = caps.length ? graficoParaImagem({
    type:'bar',
    data:{ labels: caps.map(x => x[0]+' · '+(CID_CAPITULO[x[0]]||'')),
      datasets:[{ data: caps.map(x=>x[1]),
        backgroundColor: caps.map(x => x[0]==='F' ? PALETA.avencer : '#6e6e73'), borderRadius:3 }] },
    options:{ indexAxis:'y', plugins:{ legend:{display:false} },
      scales:{ x:{ beginAtZero:true, ticks:{precision:0} } } }
  }, 900, Math.max(200, caps.length*30 + 40)) : '';

  /* 3 — recorrência por colaborador */
  const tops = Object.entries(d.porColab).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const imgColab = tops.length ? graficoParaImagem({
    type:'bar',
    data:{ labels: tops.map(x => x[0].split(' ').slice(0,2).join(' ')),
      datasets:[{ data: tops.map(x=>x[1]), backgroundColor:'#3f3f43', borderRadius:3 }] },
    options:{ plugins:{ legend:{display:false} }, scales:{ y:{ beginAtZero:true, ticks:{precision:0} } } }
  }, 900, 240) : '';

  const pctF = d.lista.length ? Math.round(d.mentais.length/d.lista.length*100) : 0;
  const topCids = Object.entries(d.porCid).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const recorrentes = tops.filter(x => x[1] > 1);

  const tend = [];
  tend.push(`Foram processados <b>${d.lista.length} atestado(s)</b>, totalizando <b>${d.dias} dia(s)</b> de afastamento e envolvendo <b>${d.colaboradores} colaborador(es)</b>.`);
  if(topCids.length) tend.push(`Prevalência de diagnósticos: <b>${topCids.map(x=>esc(x[0])+' ('+x[1]+')').join(', ')}</b>.`);
  tend.push(d.mentais.length
    ? `Registros de <b>CID F (saúde mental)</b>: ${d.mentais.length}, equivalente a <b>${pctF}%</b> do total — indicador de risco psicossocial a ser tratado no PGR.`
    : 'Nenhum registro com CID F (saúde mental) no período.');
  tend.push(recorrentes.length
    ? `Colaboradores com recorrência no mês: <b>${recorrentes.map(x=>esc(x[0])+' ('+x[1]+')').join(', ')}</b>.`
    : 'Não houve recorrência de afastamentos por um mesmo colaborador no período.');
  if(alvo && uniLabels.length > 1){
    const pos = uniLabels.indexOf(alvo) + 1;
    if(pos) tend.push(`No comparativo entre as ${uniLabels.length} unidades com registros, esta ocupa a <b>${pos}ª posição</b> em volume de afastamentos.`);
  }

  const letras = Object.keys(d.porCapitulo).filter(L => CID_BIBLIOTECA[L]).sort();
  const recs = letras.map(L => `<li style="margin-bottom:7px"><b>CID ${L} — ${esc(CID_CAPITULO[L]||'')}:</b> ${CID_BIBLIOTECA[L]}</li>`);
  if(d.porCid['SEM CID']) recs.push('<li style="margin-bottom:7px"><b>Registros sem CID:</b> auditar os lançamentos sem código para garantir a rastreabilidade exigida pelo PGR.</li>');
  if(!recs.length) recs.push('<li>Nenhum CID classificável identificado no período. Recomenda-se auditoria dos registros.</li>');

  const th = 'style="background:#3f3f43;color:#fff;padding:5px 7px;text-align:left;font-size:10.5pt;border:1px solid #999"';
  const td = 'style="padding:5px 7px;border:1px solid #999;font-size:10.5pt"';
  const tabela = `
    <table style="border-collapse:collapse;width:100%;margin:8px 0 4px">
      <thead><tr><th ${th}>Colaborador</th><th ${th}>Unidade</th><th ${th}>Data</th>
        <th ${th} style="background:#3f3f43;color:#fff;padding:5px 7px;border:1px solid #999;text-align:center">Dias</th>
        <th ${th}>CID</th><th ${th}>Capítulo</th></tr></thead>
      <tbody>
        ${d.lista.slice().sort((a,b)=>(a.data||'').localeCompare(b.data||'')).map(a => { const L = letraCid(a.cid);
          return `<tr${L==='F'?' style="background:#fdf6e3"':''}>
            <td ${td}>${esc(a.colaborador||'—')}</td>
            <td ${td}>${esc((uni(a.unidadeId)||{sigla:'—'}).sigla)}</td>
            <td ${td}>${fmtDate(a.data)}</td>

/* nomes no padrão dos arquivos oficiais:
   "Relatório de Monitoramento - NR-01 - NAT - 06-2026"
   "RELATÓRIO DE MONITORAMENTO DE ATESTADOS MÉDICOS - CORPORATIVO - 06-2026" */
function nomeArquivoRelatorio(tipo, abrangencia, mes, comTimbrado){
  const mmaaaa = mes.slice(5,7) + '-' + mes.slice(0,4);
  if(tipo === 'Corporativo')
    return `RELATÓRIO DE MONITORAMENTO DE ATESTADOS MÉDICOS - CORPORATIVO - ${mmaaaa}.html`;
  const limpo = String(abrangencia||'').replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim().slice(0,40) || 'GERAL';
  return `Relatório de Monitoramento - NR-01 - ${limpo} - ${mmaaaa}.html`;
}
/* entrega: abrir em nova aba (registra no histórico) ou baixar como arquivo */
function entregarRelatorio(html, acao, nomeArquivo, reg){
  if(acao === 'baixar'){
    baixar(nomeArquivo, html, 'text/html');
    toast('Relatório baixado — abra o arquivo e use Ctrl+P para gerar o PDF.');
    return;
  }
  abrirRelatorio(html);
  if(reg && acao !== 'reabrir') registrarRelatorio(reg);
}
function abrirRelatorio(html){
  const w = window.open('', '_blank');
  if(!w){ toast('Permita pop-ups para gerar o relatório.', 'erro'); return; }
  w.document.write(html); w.document.close();
  setTimeout(() => { w.focus(); }, 300);
  toast('Relatório gerado — use Ctrl+P para salvar em PDF.');
}
/* histórico: todo relatório emitido fica registrado */
function registrarRelatorio(reg){
  DB.relatorios = DB.relatorios || [];
  DB.relatorios.push(Object.assign({ id: uid('rel'), geradoEm: new Date().toISOString() }, reg));
  save();
  if(rota === 'atestados') viewAtestados();
}
/* baixa novamente um relatório do histórico, reconstruído com os dados atuais */
function baixarRelatorio(id){
  const r = (DB.relatorios||[]).find(x => x.id === id); if(!r) return;
  UIAte.mes = r.mes;
  if(r.tipo === 'CORPORATIVO') montarRelatorioCorporativo(!!r.timbrado, r.unidades || [], 'baixar');
  else { UIAte.uni = r.unidadeId || ''; montarRelatorioNR01(!!r.timbrado, 'baixar'); }
}
